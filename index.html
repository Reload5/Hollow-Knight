<style>
  html,body{margin:0;height:100%;background:#05060c;overflow:hidden;font-family:Georgia,'Times New Roman',serif;color:#f1e6c8;touch-action:none;user-select:none;-webkit-user-select:none;color-scheme:dark}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{background:#090a14;box-shadow:0 0 60px #000}
  #tc{display:none;position:fixed;left:0;right:0;bottom:0;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));justify-content:space-between;align-items:flex-end;pointer-events:none}
  #tc .grp{display:grid;gap:8px;pointer-events:auto}

  #tc button{border:1px solid #ffd77a44;border-radius:14px;background:#ffd77a14;color:#fbefd0;font:600 14px Georgia,serif;touch-action:none}
  #tc button.on{background:#ffd77a55}
  @media (pointer:coarse){#tc{display:flex}}
</style>

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

};
const TABLETS = {
  '0,0': 'You are the last Knight of Dawn, sworn to the buried sun. The Umbral Knight sealed its light beneath the earth. Climb toward the dawn and break the seal.',
  '1,0': 'A veil of living shadow. Darkness this thick yields only to light that moves faster than it can.',
  '2,0': 'The old road ends in a field of thorns. Below, a rusted sentinel still guards the Sunstep.',
  '3,0': 'Past the veil rest the Gilded Wings. With them, no wall is too high to climb.',
  '3,-2': 'Two braziers sleep before the throne. Wake them with thrown light and the Gate of Dusk will open.',
};
const ABIL = {
  dash:  { name: 'Sunstep',       key: 'C or Shift',      color: '#ffd36a', text: 'Blink forward as a streak of light, even in mid-air. Shadow veils cannot stop you.' },
  wings: { name: 'Gilded Wings',  key: 'Jump on a wall',  color: '#ffe9a8', text: 'Slide down walls and leap away from them. Climb what feet alone cannot.' },
  lance: { name: 'Lance of Dawn', key: 'Slash',           color: '#fff3c4', text: 'Every slash now hurls a lance of light. Lances pierce enemies and wake sleeping braziers.' },
};
const SHRINE_CH = { D: 'dash', W: 'wings', L: 'lance' };
const MINI = { '0,0': [0, 0], '1,0': [1, 0], '2,0': [2, 0], '2,1': [2, 1], '3,0': [3, 0], '3,-1': [3, -1], '3,-2': [3, -2], '4,-2': [4, -2] };

/* ===================== INPUT ===================== */
const keys = {}, pressed = {};
const KEYMAP = {ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',
  KeyZ:'jump',Space:'jump',KeyX:'attack',KeyJ:'attack',KeyC:'dash',KeyK:'dash',ShiftLeft:'dash',ShiftRight:'dash',KeyF:'heal',KeyL:'heal',Enter:'start'};
function press(a){ if (!keys[a]) pressed[a] = true; keys[a] = true; initAudio(); }
function release(a){ keys[a] = false; }
addEventListener('keydown', e => { const a = KEYMAP[e.code]; if (a) { e.preventDefault(); press(a); } });
addEventListener('keyup', e => { const a = KEYMAP[e.code]; if (a) release(a); });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
document.querySelectorAll('#tc button').forEach(b => {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', e => { e.preventDefault(); b.setPointerCapture(e.pointerId); b.classList.add('on'); press(k); });
  const up = () => { b.classList.remove('on'); release(k); };
  b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('lostpointercapture', up);
});
cv.addEventListener('pointerdown', () => { press('start'); setTimeout(() => release('start'), 60); });

/* ===================== AUDIO ===================== */
let AC = null;
function initAudio(){ if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } }
function sfx(f, d = 0.1, type = 'square', v = 0.04, f2){
  if (!AC) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d);
}

/* ===================== STATE ===================== */
const SAVE_KEY = 'lanternfall-save-v2';
const roomState = {};
const st = k => roomState[k] || (roomState[k] = { dead: new Set(), got: new Set(), lit: new Set() });
let flags = { sentinel: false, umbral: false };
const visited = new Set();
let mode = 'title', menuSel = 0, frame = 0, playFrames = 0;
let room, bgCanvas, tileCanvas, particles = [], items = [], lances = [];
let shake = 0, hitstop = 0, banner = null, msg = null, deadT = 0, fadeIn = 0, endT = 0, flash = 0;
let spawn = null, pickup = null;
const P = { x:0,y:0,w:18,h:28,vx:0,vy:0,face:1,onGround:false,coyote:0,jumpBuf:0,jumping:false,wallLock:0,wallDir:0,
  dashT:0,dashCd:0,canDash:true,atkT:0,atkCd:0,atkDir:'side',hits:null,hp:5,maxHp:5,glow:0,inv:0,healT:0,embers:0,knock:0,safeX:0,safeY:0,
  has: { dash:false, wings:false, lance:false } };

function readSave(){ try { return JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) { return null; } }
function writeSave(){
  try {
    const rooms = {};
    for (const k in roomState) rooms[k] = { got: [...roomState[k].got], lit: [...roomState[k].lit] };
    localStorage.setItem(SAVE_KEY, JSON.stringify({ has: P.has, maxHp: P.maxHp, embers: P.embers, flags, visited: [...visited], spawn, rooms, time: playFrames }));
  } catch (e) {}
}

/* ===================== TILES & COLLISION ===================== */
function tileAt(tx, ty){ return (ty >= 0 && ty < H && tx >= 0 && tx < W) ? room.tiles[ty][tx] : null; }
function isSolid(tx, ty, enemy){
  const t = tileAt(tx, ty);
  if (t === null) {
    if (enemy || room.locked) return true;
    if (ty >= 0 && ty < H) return !ROOMS[(room.rx + (tx < 0 ? -1 : 1)) + ',' + room.ry];
    if (tx >= 0 && tx < W) return !ROOMS[room.rx + ',' + (room.ry + (ty < 0 ? -1 : 1))];
    return true;
  }
  if (t === '#') return true;
  if (t === 'G') return !room.gateOpen;
  if (t === 'V') return enemy || P.dashT === 0;
  if (t === '=') return !!enemy;
  return false;
}
function collides(x, y, w, h, enemy){
  const x0 = Math.floor(x / T), x1 = Math.floor((x + w - 0.01) / T), y0 = Math.floor(y / T), y1 = Math.floor((y + h - 0.01) / T);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) if (isSolid(tx, ty, enemy)) return true;
  return false;
}
function move(b, dx, dy, enemy){
  let hx = 0, hy = 0;
  b.x += dx;
  if (dx && collides(b.x, b.y, b.w, b.h, enemy)) { if (dx > 0) b.x = Math.floor((b.x + b.w - 0.01) / T) * T - b.w; else b.x = (Math.floor(b.x / T) + 1) * T; hx = Math.sign(dx); }
  b.y += dy;
  if (dy && collides(b.x, b.y, b.w, b.h, enemy)) { if (dy > 0) b.y = Math.floor((b.y + b.h - 0.01) / T) * T - b.h; else b.y = (Math.floor(b.y / T) + 1) * T; hy = Math.sign(dy); }
  return { hx, hy };
}
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
function tilesIn(b, ch){
  const out = [], x0 = Math.floor(b.x / T), x1 = Math.floor((b.x + b.w - 0.01) / T), y0 = Math.floor(b.y / T), y1 = Math.floor((b.y + b.h - 0.01) / T);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) if (tileAt(tx, ty) === ch) out.push([tx, ty]);
  return out;
}
const touchesSpike = b => tilesIn(b, '^').some(([tx, ty]) => overlap(b, { x: tx * T + 3, y: ty * T + 12, w: T - 6, h: T - 12 }));
const inVeil = b => tilesIn(b, 'V').length > 0;

/* ===================== ROOMS ===================== */
function rng(seed){ let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
function hashStr(s){ let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; }
const ENT = { crawler: [26, 20, 3], flyer: [24, 20, 2], turret: [24, 26, 3], boss: [64, 60, 20], umbral: [36, 62, 40] };
function mkEnt(type, tx, ty, id){
  const s = ENT[type];
  const e = { type, id, w: s[0], h: s[1], hp: s[2], maxHp: s[2], vx: 0, vy: 0, kx: 0, ky: 0, flash: 0, dir: -1, face: -1, seed: Math.random() * 10,
    state: (type === 'boss' || type === 'umbral') ? 'sleep' : 'active', t: 0, cd: 60 + Math.random() * 60, alpha: 1 };
  e.x = tx * T + (T - e.w) / 2; e.y = (ty + 1) * T - e.h;
  return e;
}
function loadRoom(key){
  const def = ROOMS[key], [rx, ry] = key.split(',').map(Number), s = st(key);
  room = { key, rx, ry, def, tiles: def.map.map(r => r.split('')), ents: [], bench: null, start: null, tablets: [], braziers: [], gateOpen: false, locked: false };
  items = []; particles = []; lances = [];
  visited.add(key);
  def.map.forEach((row, ty) => [...row].forEach((c, tx) => {
    if ('#^=.VG'.includes(c)) return;
    const id = tx + ',' + ty;
    room.tiles[ty][tx] = '.';
    if (c === 'C' && !s.dead.has(id)) room.ents.push(mkEnt('crawler', tx, ty, id));
    if (c === 'F' && !s.dead.has(id)) room.ents.push(mkEnt('flyer', tx, ty, id));
    if (c === 'T' && !s.dead.has(id)) room.ents.push(mkEnt('turret', tx, ty, id));
    if (c === 'S' && !flags.sentinel) room.ents.push(mkEnt('boss', tx, ty, id));
    if (c === 'U' && !flags.umbral) room.ents.push(mkEnt('umbral', tx, ty, id));
    if (c === 'B') room.bench = { x: tx * T - 8, y: ty * T + 14, w: 48, h: 18 };
    if (c === 'P') room.start = { x: tx * T + 7, y: (ty + 1) * T - P.h };
    if (c === 't') room.tablets.push({ x: tx * T + 4, y: (ty + 1) * T - 32, w: 24, h: 32, text: TABLETS[key] });
    if (c === 'b') room.braziers.push({ id, tx, ty, lit: s.lit.has(id) });
    if (c === 'o' && !s.got.has(id)) items.push({ kind: 'ember', id, x: tx * T + 9, y: ty * T + 9, w: 14, h: 14 });
    if (c === 'H' && !s.got.has(id)) items.push({ kind: 'heart', id, x: tx * T + 6, y: ty * T + 6, w: 20, h: 20 });
    if (SHRINE_CH[c] && !P.has[SHRINE_CH[c]]) items.push({ kind: 'shrine', ab: SHRINE_CH[c], x: tx * T + 2, y: (ty + 1) * T - 44, w: 28, h: 44 });
  }));
  room.gateOpen = room.braziers.length > 0 && room.braziers.every(b => b.lit);
  buildCanvases();
  banner = { text: def.name, t: 150 };
}

function buildCanvases(){
  const hue = room.def.hue, r = rng(hashStr(room.key));
  bgCanvas = document.createElement('canvas'); bgCanvas.width = cv.width; bgCanvas.height = cv.height;
  const b = bgCanvas.getContext('2d');
  const g = b.createLinearGradient(0, 0, 0, cv.height);
  g.addColorStop(0, `hsl(${hue},32%,10%)`); g.addColorStop(1, `hsl(${hue},30%,4%)`);
  b.fillStyle = g; b.fillRect(0, 0, cv.width, cv.height);
  // faint ruined arches in the far layer
  b.strokeStyle = `hsla(${hue},25%,16%,.6)`; b.lineWidth = 10;
  for (let i = 0; i < 4; i++) { const x = r() * cv.width, rad = 60 + r() * 90; b.beginPath(); b.arc(x, cv.height * 0.75, rad, Math.PI, 0); b.stroke(); }
  for (let layer = 0; layer < 2; layer++) {
    b.fillStyle = `hsl(${hue},28%,${layer ? 11 : 7}%)`;
    for (let i = 0; i < 14; i++) {
      const x = r() * cv.width, w = 30 + r() * 80, h = 60 + r() * 200 * (layer ? 0.6 : 1);
      b.beginPath(); b.moveTo(x - w / 2, 0); b.lineTo(x, h); b.lineTo(x + w / 2, 0); b.fill();
      const h2 = 40 + r() * 160 * (layer ? 0.6 : 1);
      b.beginPath(); b.moveTo(x - w / 2 + 40, cv.height); b.lineTo(x + 40, cv.height - h2); b.lineTo(x + w / 2 + 40, cv.height); b.fill();
    }
  }
  tileCanvas = document.createElement('canvas'); tileCanvas.width = cv.width; tileCanvas.height = cv.height;
  const c = tileCanvas.getContext('2d');
  const solid = (tx, ty) => { const t = tileAt(tx, ty); return t === null || t === '#'; };
  for (let ty = 0; ty < H; ty++) for (let tx = 0; tx < W; tx++) {
    const t = room.tiles[ty][tx], x = tx * T, y = ty * T;
    if (t === '#') {
      c.fillStyle = `hsl(${hue},16%,${8 + r() * 2}%)`; c.fillRect(x, y, T, T);
      c.fillStyle = `hsla(${hue},20%,3%,.6)`;
      for (let i = 0; i < 3; i++) c.fillRect(x + r() * 26, y + r() * 26, 3 + r() * 5, 2 + r() * 3);
      if (!solid(tx, ty - 1)) {
        c.fillStyle = `hsl(${hue},22%,24%)`; c.fillRect(x, y, T, 4);
        c.fillStyle = `hsl(${hue + 35},40%,34%)`;
        for (let i = 0; i < 4; i++) c.fillRect(x + r() * 30, y - 3 - r() * 4, 2, 6);
      }
      if (!solid(tx - 1, ty)) { c.fillStyle = `hsl(${hue},18%,16%)`; c.fillRect(x, y, 2, T); }
      if (!solid(tx + 1, ty)) { c.fillStyle = `hsl(${hue},18%,16%)`; c.fillRect(x + T - 2, y, 2, T); }
      if (!solid(tx, ty + 1)) { c.fillStyle = `hsl(${hue},20%,4%)`; c.fillRect(x, y + T - 3, T, 3); }
    } else if (t === '^') {
      c.fillStyle = '#c8b8d8';
      for (let i = 0; i < 4; i++) { c.beginPath(); c.moveTo(x + i * 8, y + T); c.lineTo(x + i * 8 + 4, y + 10); c.lineTo(x + i * 8 + 8, y + T); c.fill(); }
    }
  }
  if (room.bench) {
    const bn = room.bench;
    c.fillStyle = '#6a5233'; c.fillRect(bn.x, bn.y, bn.w, 5); c.fillRect(bn.x + 4, bn.y + 5, 4, 13); c.fillRect(bn.x + bn.w - 8, bn.y + 5, 4, 13);
    c.fillStyle = '#8c6c45'; c.fillRect(bn.x, bn.y - 10, bn.w, 4);
  }
  for (const br of room.braziers) {
    const x = br.tx * T, y = br.ty * T;
    c.fillStyle = '#4a4458'; c.fillRect(x + 12, y + 18, 8, 14);
    c.fillStyle = '#6d6680'; c.beginPath(); c.moveTo(x + 4, y + 12); c.lineTo(x + 28, y + 12); c.lineTo(x + 22, y + 20); c.lineTo(x + 10, y + 20); c.fill();
  }
}

/* ===================== PARTICLES ===================== */
function burst(x, y, n, color, spd = 4, life = 30, grav = 0.15, size = 3){
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = Math.random() * spd;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: life * (0.5 + Math.random() * 0.5), max: life, color, grav, size });
  }
}
function dropEmbers(x, y, n){ for (let i = 0; i < n; i++) items.push({ kind: 'drop', x, y, w: 8, h: 8, vx: (Math.random() - 0.5) * 6, vy: -3 - Math.random() * 4, age: 0 }); }

/* ===================== GAME FLOW ===================== */
function resetWorld(){
  for (const k in roomState) delete roomState[k];
  visited.clear(); flags = { sentinel: false, umbral: false }; playFrames = 0; endT = 0; flash = 0;
  Object.assign(P, { hp: 5, maxHp: 5, glow: 0, embers: 0, has: { dash: false, wings: false, lance: false } });
}
function newGame(){
  resetWorld();
  loadRoom('0,0');
  spawn = { key: '0,0', x: room.start.x, y: room.start.y };
  placeAtSpawn();
  msg = { text: 'Arrows / WASD move · Z jump · X slash (aim with ↑ / ↓) · hold F to heal · ↑ to read stones and rest at benches', t: 480 };
}
function continueGame(s){
  resetWorld();
  P.has = Object.assign({ dash: false, wings: false, lance: false }, s.has);
  P.maxHp = s.maxHp || 5; P.embers = s.embers || 0; flags = Object.assign({ sentinel: false, umbral: false }, s.flags);
  (s.visited || []).forEach(k => visited.add(k));
  for (const k in s.rooms || {}) { const r = st(k); s.rooms[k].got.forEach(i => r.got.add(i)); s.rooms[k].lit.forEach(i => r.lit.add(i)); }
  playFrames = s.time || 0;
  spawn = s.spawn && ROOMS[s.spawn.key] ? s.spawn : { key: '0,0', x: 71, y: 452 };
  loadRoom(spawn.key); placeAtSpawn();
}
function placeAtSpawn(){
  Object.assign(P, { x: spawn.x, y: spawn.y, vx: 0, vy: 0, hp: P.maxHp, glow: 0, inv: 0, knock: 0, dashT: 0, atkT: 0, healT: 0, canDash: true });
  P.safeX = P.x; P.safeY = P.y; mode = 'play'; fadeIn = 1;
}
function respawnAll(){ for (const k in roomState) roomState[k].dead.clear(); }
function respawn(){ respawnAll(); loadRoom(spawn.key); placeAtSpawn(); P.inv = 60; }

function hurt(fromX){
  if (P.inv > 0 || mode !== 'play' || endT) return false;
  P.hp--; P.inv = 75; P.vy = -7; P.knock = (P.x + P.w / 2 < fromX ? -7 : 7); P.dashT = 0; P.healT = 0;
  shake = 12; hitstop = 8; sfx(160, 0.3, 'sawtooth', 0.06, 50);
  burst(P.x + P.w / 2, P.y + P.h / 2, 14, '#fff6dc', 5, 30);
  if (P.hp <= 0) { mode = 'dead'; deadT = 120; burst(P.x + P.w / 2, P.y + P.h / 2, 50, '#ffd36a', 6, 70); sfx(300, 1, 'sine', 0.06, 60); }
  return true;
}
function goRoom(dx, dy){
  const k = (room.rx + dx) + ',' + (room.ry + dy);
  if (!ROOMS[k]) return;
  loadRoom(k);
  if (dx === 1) P.x = 2;
  if (dx === -1) P.x = W * T - P.w - 2;
  if (dy === -1) { P.y = H * T - P.h - 2; P.vy = -13.5; }
  if (dy === 1) P.y = 2;
  P.safeX = P.x; P.safeY = P.y; P.canDash = true;
}

/* ===================== PLAYER ===================== */
function attackBox(){
  if (P.atkDir === 'up') return { x: P.x - 12, y: P.y - 44, w: 42, h: 46 };
  if (P.atkDir === 'down') return { x: P.x - 12, y: P.y + P.h - 2, w: 42, h: 44 };
  return P.face > 0 ? { x: P.x + P.w - 2, y: P.y - 6, w: 46, h: 38 } : { x: P.x - 44, y: P.y - 6, w: 46, h: 38 };
}
function nearBench(){ return room.bench && overlap(P, { x: room.bench.x - 6, y: room.bench.y - 30, w: room.bench.w + 12, h: 50 }); }
function nearTablet(){ return room.tablets.find(t => overlap(P, { x: t.x - 14, y: t.y - 10, w: t.w + 28, h: t.h + 10 })); }

function updatePlayer(){
  const inX = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  let wallDir = 0;
  if (P.has.wings && !P.onGround) wallDir = collides(P.x + 1, P.y + 2, P.w, P.h - 4) ? 1 : collides(P.x - 1, P.y + 2, P.w, P.h - 4) ? -1 : 0;
  P.wallDir = wallDir;

  if (P.inv > 0) P.inv--;
  if (P.dashCd > 0) P.dashCd--;
  if (P.atkCd > 0) P.atkCd--;
  if (P.wallLock > 0) P.wallLock--;
  if (P.coyote > 0) P.coyote--;
  if (P.jumpBuf > 0) P.jumpBuf--;
  if (pressed.jump) P.jumpBuf = 8;

  // focus light to heal
  const canHeal = keys.heal && P.onGround && P.glow >= 3 && P.hp < P.maxHp && P.atkT === 0 && P.dashT === 0;
  if (canHeal) {
    P.healT++; if (frame % 5 === 0) burst(P.x + P.w / 2, P.y + P.h, 2, '#ffd36a', 1.5, 30, -0.08, 2);
    if (P.healT >= 50) { P.hp++; P.glow -= 3; P.healT = 0; burst(P.x + P.w / 2, P.y + P.h / 2, 24, '#fff0b8', 4, 40, -0.05); sfx(520, 0.4, 'sine', 0.06, 880); }
  } else P.healT = 0;

  if (P.healT === 0 && inX && P.wallLock === 0 && P.dashT === 0) P.face = inX;

  // Sunstep
  if (pressed.dash && P.has.dash && P.dashCd === 0 && P.canDash && P.healT === 0) {
    P.dashT = 12; P.dashCd = 26; if (!P.onGround) P.canDash = false;
    if (wallDir) P.face = -wallDir; else if (inX) P.face = inX;
    sfx(620, 0.18, 'triangle', 0.04, 1400);
  }
  // slash (+ lance of light)
  if (pressed.attack && P.atkCd === 0 && P.healT === 0) {
    P.atkT = 12; P.atkCd = 20; P.hits = new Set();
    P.atkDir = keys.up ? 'up' : (keys.down && !P.onGround ? 'down' : 'side');
    sfx(900, 0.08, 'square', 0.025, 300);
    if (P.has.lance) {
      const cx = P.x + P.w / 2, cy = P.y + P.h / 2;
      const d = P.atkDir === 'up' ? [0, -1] : P.atkDir === 'down' ? [0, 1] : [P.face, 0];
      const horiz = d[0] !== 0;
      lances.push({ x: cx - (horiz ? 15 : 5), y: cy - (horiz ? 5 : 15), w: horiz ? 30 : 10, h: horiz ? 10 : 30, vx: d[0] * 12, vy: d[1] * 12, life: 34, hit: new Set() });
      sfx(1500, 0.12, 'sine', 0.03, 2400);
    }
  }

  let dx, dy, dashing = false;
  if (P.dashT > 0) {
    dashing = true; P.vy = 0; dx = P.face * 10.5; dy = 0;
    particles.push({ x: P.x + P.w / 2, y: P.y + P.h / 2, vx: 0, vy: 0, life: 16, max: 16, color: '#ffd36a', grav: 0, size: 10 });
  } else {
    const target = P.healT ? 0 : inX * 4.2;
    P.vx = P.wallLock > 0 ? P.vx + (target - P.vx) * 0.12 : target;
    P.vy = Math.min(P.vy + 0.6, 14);
    if (wallDir && P.vy > 0 && inX === wallDir) {
      P.vy = Math.min(P.vy, 2.2);
      if (frame % 5 === 0) particles.push({ x: P.x + (wallDir > 0 ? P.w : 0), y: P.y + P.h - 4, vx: -wallDir, vy: -0.5, life: 16, max: 16, color: '#ffe9a8', grav: 0, size: 2 });
    }
    if (P.jumpBuf > 0 && P.healT === 0) {
      if (P.coyote > 0) {
        P.vy = -12.2; P.jumping = true; P.coyote = 0; P.jumpBuf = 0; sfx(380, 0.12, 'triangle', 0.04, 620);
      } else if (wallDir) {
        P.vy = -11.5; P.vx = -wallDir * 6.5; P.wallLock = 10; P.face = -wallDir; P.jumping = true; P.jumpBuf = 0; P.canDash = true;
        sfx(460, 0.12, 'triangle', 0.04, 760);
        burst(P.x + (wallDir > 0 ? P.w : 0), P.y + P.h / 2, 8, '#ffe9a8', 2.5, 20);
      }
    }
    if (!keys.jump && P.jumping && P.vy < -3) { P.vy = -3; P.jumping = false; }
    if (P.vy >= 0) P.jumping = false;
    dx = P.vx + P.knock; dy = P.vy;
  }
  P.knock *= 0.82; if (Math.abs(P.knock) < 0.1) P.knock = 0;

  const wasGround = P.onGround;
  const r = move(P, dx, dy, false);
  if (dashing) {
    if (r.hx) P.dashT = 0;
    else if (!(P.dashT === 1 && inVeil(P))) P.dashT--;      // never end a Sunstep inside a veil
    if (inVeil(P) && frame % 2 === 0) burst(P.x + P.w / 2, P.y + P.h / 2, 3, '#b48cff', 3, 20, 0);
  }
  if (r.hy > 0) { P.vy = 0; P.onGround = true; P.canDash = true; if (!wasGround) burst(P.x + P.w / 2, P.y + P.h, 4, '#8a8aa0', 1.5, 14); }
  else { P.onGround = false; if (r.hy < 0) P.vy = 0; }
  if (P.onGround) P.coyote = 6;

  if (P.onGround && P.inv === 0) {
    const fy = Math.floor((P.y + P.h + 2) / T);
    if (tileAt(Math.floor(P.x / T), fy) === '#' && tileAt(Math.floor((P.x + P.w) / T), fy) === '#') { P.safeX = P.x; P.safeY = P.y; }
  }

  // slash hits
  if (P.atkT > 0) {
    P.atkT--;
    if (P.atkT >= 6) {
      const ab = attackBox();
      for (const e of room.ents) {
        if (e.dead || P.hits.has(e) || !overlap(ab, e)) continue;
        if (e.type === 'orb') { e.dead = true; burst(e.x + 6, e.y + 6, 8, '#b48cff', 3, 16); continue; }
        if (HAZ.has(e.type)) continue;
        P.hits.add(e);
        damage(e, 1, P.atkDir === 'side' ? P.face : 0, P.atkDir === 'up' ? -1 : P.atkDir === 'down' ? 1 : 0, true);
        if (P.atkDir === 'side') P.knock = -P.face * 4.5;
        if (P.atkDir === 'down') pogo();
      }
      if (P.atkDir === 'down' && !P.hits.has('spike') && touchesSpike(ab)) { P.hits.add('spike'); pogo(); sfx(1200, 0.05, 'square', 0.02); }
    }
  }

  // thorns
  if (touchesSpike(P) && mode === 'play') {
    P.inv = 0;
    if (hurt(P.x + P.w / 2) && mode === 'play') { P.x = P.safeX; P.y = P.safeY; P.vx = P.vy = P.knock = 0; P.dashT = 0; fadeIn = 0.8; }
  }

  // interact
  if (pressed.up && P.onGround) {
    const tab = nearTablet();
    if (tab) { msg = { text: tab.text, t: 480 }; sfx(520, 0.2, 'sine', 0.03, 660); }
    else if (nearBench()) {
      P.hp = P.maxHp; spawn = { key: room.key, x: P.x, y: P.y }; respawnAll(); writeSave();
      msg = { text: 'You rest by the bench. Your light is restored and your progress is saved.', t: 220 };
      burst(P.x + P.w / 2, P.y + P.h / 2, 30, '#fff0b8', 3, 50, -0.04); sfx(330, 0.5, 'sine', 0.05, 660);
    }
  }

  const cx = P.x + P.w / 2, cy = P.y + P.h / 2;
  if (cx < 0) goRoom(-1, 0); else if (cx > W * T) goRoom(1, 0); else if (cy < 0) goRoom(0, -1); else if (cy > H * T) goRoom(0, 1);
}
function pogo(){ P.vy = -10.5; P.jumping = false; P.canDash = true; }

/* ===================== LANCES ===================== */
function updateLances(){
  for (const l of lances) {
    l.x += l.vx; l.y += l.vy; l.life--;
    if (frame % 2 === 0) particles.push({ x: l.x + l.w / 2, y: l.y + l.h / 2, vx: 0, vy: 0, life: 12, max: 12, color: '#ffe9a8', grav: 0, size: 4 });
    if (l.life <= 0 || collides(l.x + 4, l.y + 2, l.w - 8, l.h - 4, true)) { l.dead = true; burst(l.x + l.w / 2, l.y + l.h / 2, 8, '#fff3c4', 3, 16); continue; }
    for (const e of room.ents) {
      if (e.dead || l.hit.has(e) || !overlap(l, e)) continue;
      if (e.type === 'orb') { e.dead = true; continue; }
      if (HAZ.has(e.type)) continue;
      l.hit.add(e); damage(e, 1, Math.sign(l.vx), Math.sign(l.vy), false);
    }
    for (const br of room.braziers) {
      if (br.lit || !overlap(l, { x: br.tx * T, y: br.ty * T - 8, w: T, h: T + 8 })) continue;
      br.lit = true; st(room.key).lit.add(br.id);
      burst(br.tx * T + 16, br.ty * T + 8, 24, '#ffb347', 4, 40, -0.05); sfx(700, 0.4, 'sine', 0.05, 1100);
      if (room.braziers.every(b => b.lit)) {
        room.gateOpen = true; shake = 14; writeSave();
        msg = { text: 'Both braziers burn. The Gate of Dusk grinds open.', t: 240 }; sfx(90, 0.8, 'sawtooth', 0.05, 45);
      } else msg = { text: 'The brazier wakes. One more still sleeps.', t: 180 };
    }
  }
  lances = lances.filter(l => !l.dead);
}

/* ===================== ENEMIES ===================== */
const HAZ = new Set(['wave', 'orb', 'fall', 'hz']);
function damage(e, dmg, kx, ky, fromSlash){
  e.hp -= dmg; e.flash = 7; hitstop = Math.max(hitstop, 3);
  if (fromSlash) P.glow = Math.min(9, P.glow + 1);
  if (e.type === 'crawler' || e.type === 'flyer') { e.kx = kx * 7; e.ky = ky * 6; }
  if (e.type === 'boss' && e.state === 'sleep') wakeBoss(e);
  sfx(220, 0.1, 'square', 0.05, 90);
  burst(e.x + e.w / 2, e.y + e.h / 2, 8, '#fff', 4, 16);
  if (e.hp <= 0) killEnemy(e);
}
function killEnemy(e){
  e.dead = true; shake = Math.max(shake, e.type === 'boss' || e.type === 'umbral' ? 30 : 6);
  const cx = e.x + e.w / 2, cy = e.y + e.h / 2;
  burst(cx, cy, e.type === 'umbral' ? 120 : e.type === 'boss' ? 80 : 20, e.type === 'boss' ? '#ff9a4a' : '#b48cff', e.type === 'umbral' ? 10 : 6, 60);
  dropEmbers(cx, cy, e.type === 'boss' ? 25 : e.type === 'umbral' ? 40 : e.type === 'flyer' ? 2 : 3);
  sfx(120, 0.4, 'sawtooth', 0.05, 40);
  if (e.type === 'boss') {
    flags.sentinel = true; hitstop = 20;
    room.ents.forEach(o => { if (HAZ.has(o.type)) o.dead = true; });
    banner = { text: 'The Sentinel falls silent', t: 200 };
    msg = { text: 'The shrine behind the Sentinel is awake.', t: 220 };
    writeSave();
  } else if (e.type === 'umbral') {
    flags.umbral = true; hitstop = 30; endT = 200;
    room.ents.forEach(o => { if (HAZ.has(o.type)) o.dead = true; });
    writeSave();
  } else st(room.key).dead.add(e.id);
}
function wakeBoss(e){ e.state = 'roar'; e.t = 70; shake = 22; banner = { text: 'The Rusted Sentinel', t: 170 }; sfx(70, 0.8, 'sawtooth', 0.08, 35); }
function shockwaves(e, speed, color){
  for (const s of [-1, 1]) room.ents.push({ type: 'wave', x: e.x + e.w / 2 - 9, y: e.y + e.h - 22, w: 18, h: 22, vx: s * speed, life: 140, color });
}
function umbralChoose(e, enr, sp, dist){
  if (enr && !e.p2) {
    e.p2 = true; e.state = 'intro'; e.t = 70; shake = 24; flash = 0.5;
    banner = { text: 'The shadow deepens', t: 140 }; sfx(50, 1, 'sawtooth', 0.08, 25);
    return;
  }
  let pool = dist < 110 ? ['tslash', 'tslash', 'tleap'] : ['tdash', 'tleap', 'tdash'];
  if (enr) pool = pool.concat(['tspikes', 'tblink']);
  pool = pool.filter(p => p !== e.last || pool.length === 1);
  const pick = pool[Math.floor(Math.random() * pool.length)];
  e.last = pick; e.state = pick;
  e.t = Math.round({ tslash: 18, tdash: 26, tleap: 22, tspikes: 34, tblink: 22 }[pick] * sp);
}
function endDash(e, enr){
  e.vx = 0;
  if (enr && !e.combo) { e.combo = 1; e.face *= -1; e.state = 'tdash'; e.t = 12; }
  else { e.combo = 0; e.state = 'idle'; e.t = enr ? 28 : 40; }
}

function updateEnts(){
  const pcx = P.x + P.w / 2, pcy = P.y + P.h / 2;
  room.locked = room.ents.some(e => (e.type === 'boss' || e.type === 'umbral') && e.state !== 'sleep');
  for (const e of room.ents) {
    if (e.dead) continue;
    if (e.flash > 0) e.flash--;
    const ecx = e.x + e.w / 2, ecy = e.y + e.h / 2;
    if (e.type === 'crawler') {
      e.vy = Math.min(e.vy + 0.6, 12); e.kx *= 0.8;
      const r = move(e, e.dir * 1.1 + e.kx, e.vy, true);
      if (r.hy) e.vy = 0;
      if (r.hx) e.dir *= -1;
      else if (r.hy > 0) { const fx = e.dir > 0 ? e.x + e.w + 2 : e.x - 2; if (!isSolid(Math.floor(fx / T), Math.floor((e.y + e.h + 4) / T), true)) e.dir *= -1; }
    } else if (e.type === 'flyer') {
      const dx = pcx - ecx, dy = pcy - ecy, d = Math.hypot(dx, dy) || 1;
      if (d < 330) { e.vx += dx / d * 0.13; e.vy += dy / d * 0.13; } else e.vy += Math.sin(frame * 0.05 + e.seed) * 0.04;
      const sp = Math.hypot(e.vx, e.vy); if (sp > 2.4) { e.vx *= 2.4 / sp; e.vy *= 2.4 / sp; }
      e.vx *= 0.985; e.vy *= 0.985;
      const r = move(e, e.vx + e.kx, e.vy + e.ky, true);
      if (r.hx) e.vx *= -0.5; if (r.hy) e.vy *= -0.5;
      e.kx *= 0.85; e.ky *= 0.85;
    } else if (e.type === 'turret') {
      e.face = pcx < ecx ? -1 : 1;
      e.vy = Math.min(e.vy + 0.6, 12); if (move(e, 0, e.vy, true).hy) e.vy = 0;
      if (--e.cd <= 0) {
        const d = Math.hypot(pcx - ecx, pcy - (e.y + 6)) || 1;
        if (d < 470) {
          room.ents.push({ type: 'orb', x: ecx - 6, y: e.y, w: 12, h: 12, vx: (pcx - ecx) / d * 3.2, vy: (pcy - e.y - 6) / d * 3.2, life: 220 });
          sfx(260, 0.15, 'triangle', 0.03, 140); e.cd = 130;
        } else e.cd = 30;
      }
    } else if (e.type === 'boss') {
      const enr = e.hp <= e.maxHp / 2;
      e.vy = Math.min(e.vy + 0.7, 14);
      let dx = 0;
      switch (e.state) {
        case 'sleep': if (Math.abs(pcx - ecx) < 420 && Math.abs(pcy - ecy) < 200) wakeBoss(e); break;
        case 'roar': if (--e.t <= 0) { e.state = 'idle'; e.t = 30; } break;
        case 'idle': e.face = pcx < ecx ? -1 : 1; if (--e.t <= 0) { e.state = Math.random() < 0.5 ? 'tcharge' : 'tleap'; e.t = enr ? 18 : 30; } break;
        case 'tcharge': if (--e.t <= 0) { e.state = 'charge'; e.vx = e.face * (enr ? 10 : 8); sfx(90, 0.3, 'sawtooth', 0.05, 60); } break;
        case 'charge': dx = e.vx; if (frame % 3 === 0) burst(ecx, e.y + e.h, 2, '#8a6a50', 2, 16); break;
        case 'tleap': if (--e.t <= 0) { e.state = 'leap'; e.vy = -14; e.vx = clamp((pcx - ecx) / 42, -7, 7); } break;
        case 'leap': dx = e.vx; break;
      }
      const r = move(e, dx, e.vy, true);
      if (r.hy > 0) {
        if (e.state === 'leap') { e.state = 'idle'; e.t = enr ? 30 : 45; shake = 14; e.vx = 0; sfx(60, 0.4, 'sawtooth', 0.07, 30); shockwaves(e, enr ? 7.5 : 6.5, '#ff8a3c'); burst(ecx, e.y + e.h, 20, '#8a6a50', 5, 30); }
        e.vy = 0;
      } else if (r.hy < 0) e.vy = 0;
      if (r.hx && e.state === 'charge') { e.state = 'idle'; e.t = enr ? 35 : 55; shake = 12; e.vx = 0; burst(ecx + e.face * 32, ecy, 16, '#8a6a50', 4, 26); sfx(80, 0.3, 'square', 0.05, 40); }
    } else if (e.type === 'umbral') {
      const enr = e.hp <= e.maxHp / 2, sp = enr ? 0.75 : 1;
      e.vy = Math.min(e.vy + 0.7, 15);
      let dx = 0;
      switch (e.state) {
        case 'sleep':
          if (pcx > 9 * T) { e.state = 'intro'; e.t = 100; shake = 18; banner = { text: 'The Umbral Knight', t: 190 }; sfx(55, 1.2, 'sawtooth', 0.08, 30); }
          break;
        case 'intro': e.face = pcx < ecx ? -1 : 1; if (--e.t <= 0) { e.state = 'idle'; e.t = 20; } break;
        case 'idle': e.face = pcx < ecx ? -1 : 1; if (--e.t <= 0) umbralChoose(e, enr, sp, Math.abs(pcx - ecx)); break;
        case 'tslash': e.face = pcx < ecx ? -1 : 1;
          if (--e.t <= 0) {
            e.state = 'slash'; e.t = 12; e.vx = e.face * 4;
            room.ents.push({ type: 'hz', x: e.face > 0 ? e.x + e.w - 8 : e.x - 84 + 8, y: e.y - 14, w: 84, h: 76, life: 9, face: e.face });
            sfx(700, 0.15, 'sawtooth', 0.05, 150);
          }
          break;
        case 'slash': dx = e.vx; e.vx *= 0.8; if (--e.t <= 0) { e.state = 'idle'; e.t = Math.round(34 * sp); } break;
        case 'tdash': if (--e.t <= 0) { e.state = 'dash'; e.vx = e.face * 13; e.t = 32; sfx(200, 0.25, 'sawtooth', 0.05, 90); } break;
        case 'dash': dx = e.vx;
          if (frame % 2 === 0) particles.push({ x: ecx, y: ecy, vx: 0, vy: 0, life: 14, max: 14, color: '#3a2060', grav: 0, size: 26 });
          if (--e.t <= 0) endDash(e, enr);
          break;
        case 'tleap': if (--e.t <= 0) { e.state = 'leap'; e.vy = -15; e.vx = clamp((pcx - ecx) / 40, -8, 8); } break;
        case 'leap': dx = e.vx; break;
        case 'tspikes':
          if (--e.t <= 0) {
            for (let i = -2; i <= 2; i++) room.ents.push({ type: 'fall', x: clamp(pcx + i * 100 - 10, T + 4, W * T - T - 24), y: T, w: 20, h: 44, warn: 48 + Math.abs(i) * 8, vy: 0 });

          }

        case 'tblink':

          }

      }
      const r = move(e, dx, e.vy, true);

    } else if (e.type === 'fall') {

    } else if (e.type === 'hz') {
      if (--e.life <= 0) e.dead = true;
    }

    if (e.dead || e.state === 'sleep' || e.alpha < 0.4) continue;
    if (e.type === 'fall' && e.warn > 0) continue;
    const box = HAZ.has(e.type) ? e : { x: e.x + 3, y: e.y + 3, w: e.w - 6, h: e.h - 3 };
    if (overlap(P, box)) hurt(e.type === 'hz' ? e.x + e.w / 2 - e.face * 40 : ecx);
  }
  room.ents = room.ents.filter(e => !e.dead);
}

/* ===================== ITEMS ===================== */
function updateItems(){
  const bossAlive = room.ents.some(e => e.type === 'boss');
  for (const it of items) {
    if (it.kind === 'drop') {
      it.age++;
      const dx = P.x + P.w / 2 - it.x, dy = P.y + P.h / 2 - it.y, d = Math.hypot(dx, dy) || 1;
      if (it.age > 25 && d < 90) { it.x += dx / d * 6; it.y += dy / d * 6; }
      else { it.vy = Math.min(it.vy + 0.4, 9); it.vx *= 0.97; const r = move(it, it.vx, it.vy, true); if (r.hy > 0) { it.vy *= -0.4; it.vx *= 0.7; } if (r.hx) it.vx *= -0.6; }
      if (it.age > 15 && overlap(P, it)) { it.gone = true; P.embers++; sfx(1300 + Math.random() * 300, 0.06, 'sine', 0.03); }
      continue;
    }
    if (mode !== 'play' || !overlap(P, it)) continue;
    if (it.kind === 'ember') { it.gone = true; st(room.key).got.add(it.id); P.embers += 5; sfx(1100, 0.2, 'sine', 0.04, 1600); burst(it.x + 7, it.y + 7, 14, '#ffb347', 3, 30); }
    if (it.kind === 'heart') {
      it.gone = true; st(room.key).got.add(it.id); P.maxHp++; P.hp = P.maxHp; sfx(440, 0.6, 'sine', 0.06, 880);
      burst(it.x + 10, it.y + 10, 30, '#ff9a6a', 4, 50); msg = { text: 'Heart Vessel found. Your maximum health rises by one.', t: 240 }; writeSave();
    }
    if (it.kind === 'shrine' && !bossAlive) {
      it.gone = true; P.has[it.ab] = true; P.hp = P.maxHp; P.glow = 9;
      mode = 'pickup'; pickup = { ab: it.ab, t: 0 }; flash = 1;
      burst(it.x + 14, it.y + 10, 60, ABIL[it.ab].color, 6, 60, -0.02);
      sfx(330, 1.2, 'sine', 0.07, 990); sfx(495, 1.2, 'sine', 0.04, 1485);
      writeSave();
    }
  }
  items = items.filter(i => !i.gone);
}

/* ===================== STEP ===================== */
function step(){
  frame++;
  if (mode === 'title') {
    const opts = titleOptions();
    if (pressed.up) menuSel = (menuSel + opts.length - 1) % opts.length;
    if (pressed.down) menuSel = (menuSel + 1) % opts.length;
    menuSel = Math.min(menuSel, opts.length - 1);
    if (pressed.start || pressed.jump || pressed.attack) {
      const o = opts[menuSel];
      if (o === 'Continue') continueGame(readSave()); else newGame();
    }
  } else if (mode === 'win') {
    if (pressed.start || pressed.jump) { mode = 'title'; menuSel = 0; }
  } else if (mode === 'pickup') {
    pickup.t++;
    if (pickup.t > 50 && (pressed.start || pressed.jump || pressed.attack)) { mode = 'play'; flash = 0.4; }
  } else if (hitstop > 0) hitstop--;
  else {
    if (mode === 'play') {
      playFrames++; updatePlayer();
      if (endT > 0) { endT--; flash = Math.max(flash, 1 - endT / 200); if (endT === 0) mode = 'win'; }
    }
    if (mode === 'dead' && --deadT <= 0) respawn();
    if (mode === 'play' || mode === 'dead') { updateLances(); updateEnts(); updateItems(); }
  }
  for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy += p.grav; p.vx *= 0.96; p.life--; }
  particles = particles.filter(p => p.life > 0);
  if (shake > 0) shake *= 0.85; if (shake < 0.3) shake = 0;
  if (banner && --banner.t <= 0) banner = null;
  if (msg && mode === 'play' && --msg.t <= 0) msg = null;
  if (fadeIn > 0) fadeIn = Math.max(0, fadeIn - 0.04);
  if (flash > 0 && !endT) flash = Math.max(0, flash - 0.03);
  for (const k in pressed) delete pressed[k];
}
function titleOptions(){ const s = readSave(); return s ? ['Continue', 'New game'] : ['Begin']; }

/* ===================== DRAW HELPERS ===================== */
function circle(x, y, r){ ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
function glow(x, y, r, color, a){ const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, color.replace('A', a)); g.addColorStop(1, color.replace('A', 0)); ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); }
function drawFlame(x, y, s, c1, c2){
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = c1; ctx.beginPath(); ctx.moveTo(0, -20); ctx.quadraticCurveTo(10, -6, 7, 0); ctx.quadraticCurveTo(0, 5, -7, 0); ctx.quadraticCurveTo(-10, -6, 0, -20); ctx.fill();
  if (c2) { ctx.fillStyle = c2; ctx.beginPath(); ctx.moveTo(0, -10); ctx.quadraticCurveTo(5, -3, 3, 0); ctx.quadraticCurveTo(0, 2, -3, 0); ctx.quadraticCurveTo(-5, -3, 0, -10); ctx.fill(); }

function wrap(text, maxW){
  const words = text.split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }

}

/* ===================== DRAW: HERO ===================== */
function drawPlayer(){

/* ===================== DRAW: WORLD OBJECTS ===================== */
function drawDynamicTiles(){

    if (near) glow(tab.x + 12, tab.y + 14, 40, 'rgba(255,220,140,A)', 0.25);

    ctx.fillStyle = near ? '#ffe39a' : '#8a8aa8'; for (let i = 0; i < 3; i++) ctx.fillRect(tab.x + 6, tab.y + 11 + i * 6, 12 - (i % 2) * 4, 2);

}
function drawItem(it){
  const f = Math.sin(frame * 0.08 + it.x) * 3;
  if (it.kind === 'ember' || it.kind === 'drop') {
    const r = it.kind === 'ember' ? 7 : 4, x = it.x + it.w / 2, y = it.y + it.h / 2 + (it.kind === 'ember' ? f : 0);
    glow(x, y, r * 3, 'rgba(255,170,60,A)', 0.4);
    ctx.fillStyle = '#ffb347'; circle(x, y, r); ctx.fillStyle = '#fff2c8'; circle(x - r * 0.3, y - r * 0.3, r * 0.35);
  } else if (it.kind === 'heart') {
    const x = it.x + 10, y = it.y + 10 + f;
    glow(x, y, 26, 'rgba(255,130,100,A)', 0.4);
    drawFlame(x, y + 8, 1.1, '#ff8a6a', '#ffd0a0');
  } else if (it.kind === 'shrine') {
    const locked = room.ents.some(e => e.type === 'boss');
    const x = it.x + 14, base = it.y + it.h;
    ctx.fillStyle = '#4a4458'; ctx.fillRect(x - 12, base - 12, 24, 12); ctx.fillRect(x - 8, base - 18, 16, 6);
    const oy = base - 32 + f;
    if (locked) { ctx.fillStyle = '#3a3448'; circle(x, oy, 7); ctx.strokeStyle = '#5a5070'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, oy, 10, 0, Math.PI * 2); ctx.stroke(); }
    else {
      glow(x, oy, 50, 'rgba(255,220,130,A)', 0.5 + Math.sin(frame * 0.1) * 0.15);
      ctx.save(); ctx.translate(x, oy); ctx.rotate(frame * 0.03); ctx.fillStyle = ABIL[it.ab].color; ctx.fillRect(-7, -7, 14, 14); ctx.restore();
      ctx.fillStyle = '#fff'; circle(x, oy, 4);
    }
  }
}

/* ===================== DRAW: HUD ===================== */
function drawAbilityIcon(ab, x, y, have){
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = have ? 'rgba(255,214,110,.18)' : 'rgba(255,255,255,.04)'; circle(0, 0, 11);
  ctx.strokeStyle = have ? '#ffd36a' : 'rgba(255,255,255,.15)'; ctx.fillStyle = ctx.strokeStyle; ctx.lineWidth = 2;
  if (ab === 'dash') { for (let i = 0; i < 2; i++) { ctx.beginPath(); ctx.moveTo(-5 + i * 5, -5); ctx.lineTo(0 + i * 5, 0); ctx.lineTo(-5 + i * 5, 5); ctx.stroke(); } }
  if (ab === 'wings') { ctx.beginPath(); ctx.ellipse(-3, -1, 6, 3, -0.6, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.ellipse(3, -1, 6, 3, 0.6, 0, Math.PI * 2); ctx.fill(); }
  if (ab === 'lance') { ctx.beginPath(); ctx.moveTo(7, -7); ctx.lineTo(-6, 6); ctx.stroke(); ctx.beginPath(); ctx.moveTo(7, -7); ctx.lineTo(1, -6); ctx.lineTo(6, -1); ctx.fill(); }
  ctx.restore();
}
function drawMinimap(){
  const ox = cv.width - 150, oy = 18, cw = 22, ch = 13;
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(ox - 8, oy - 6, 5 * (cw + 4) + 12, 4 * (ch + 4) + 10);
  for (const k in MINI) {
    if (!visited.has(k)) continue;
    const [mx, my] = MINI[k], x = ox + mx * (cw + 4), y = oy + (my + 2) * (ch + 4);
    ctx.fillStyle = k === room.key ? '#ffd36a' : 'rgba(241,230,200,.35)'; ctx.fillRect(x, y, cw, ch);
    if (ROOMS[k].map.some(r => r.includes('B'))) { ctx.fillStyle = k === room.key ? '#3a2a10' : '#ffd36a'; ctx.fillRect(x + cw / 2 - 2, y + ch / 2 - 2, 4, 4); }
  }
}
function drawHUD(){
  ctx.fillStyle = 'rgba(0,0,0,.5)'; circle(42, 42, 24);
  ctx.save(); ctx.beginPath(); ctx.arc(42, 42, 21, 0, Math.PI * 2); ctx.clip();
  const lvl = P.glow / 9; ctx.fillStyle = '#ffd36a'; ctx.fillRect(18, 63 - 42 * lvl, 48, 42 * lvl); ctx.restore();
  ctx.strokeStyle = '#f6ecd2'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(42, 42, 22, 0, Math.PI * 2); ctx.stroke();
  for (let i = 0; i < P.maxHp; i++) drawFlame(84 + i * 26, 44, 0.9, i < P.hp ? '#ffb347' : 'rgba(255,255,255,.12)', i < P.hp ? '#fff0c0' : null);
  ctx.fillStyle = '#ffb347'; circle(90, 66, 5);
  ctx.fillStyle = '#f6ecd2'; ctx.font = '16px Georgia'; ctx.textAlign = 'left'; ctx.fillText(P.embers, 102, 72);
  ['dash', 'wings', 'lance'].forEach((ab, i) => drawAbilityIcon(ab, 28 + i * 28, 92, P.has[ab]));
  drawMinimap();
  const boss = room.ents.find(e => (e.type === 'boss' || e.type === 'umbral') && e.state !== 'sleep');
  if (boss) {
    const name = boss.type === 'boss' ? 'The Rusted Sentinel' : 'The Umbral Knight';
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(280, cv.height - 34, 400, 12);
    ctx.fillStyle = boss.type === 'boss' ? '#c0442a' : '#8a5ae0'; ctx.fillRect(282, cv.height - 32, 396 * Math.max(0, boss.hp) / boss.maxHp, 8);
    ctx.fillStyle = '#efe2f5'; ctx.font = '14px Georgia'; ctx.textAlign = 'center'; ctx.fillText(name, cv.width / 2, cv.height - 40);
  }
  if (banner) {
    ctx.globalAlpha = Math.max(0, Math.min(1, banner.t / 30, (190 - banner.t) / 30)); ctx.fillStyle = '#fbefd0'; ctx.textAlign = 'center';
    ctx.font = 'italic 34px Georgia'; ctx.fillText(banner.text, cv.width / 2, 130);
    ctx.fillRect(cv.width / 2 - 90, 145, 180, 1); ctx.globalAlpha = 1;
  }
  if (msg) {
    ctx.globalAlpha = Math.min(1, msg.t / 30); ctx.font = '16px Georgia'; ctx.textAlign = 'center';
    const lines = wrap(msg.text, 620), h = lines.length * 22 + 16;
    ctx.fillStyle = 'rgba(6,6,14,.75)'; ctx.fillRect(cv.width / 2 - 330, 166, 660, h);
    ctx.strokeStyle = 'rgba(255,214,110,.3)'; ctx.lineWidth = 1; ctx.strokeRect(cv.width / 2 - 330, 166, 660, h);
    ctx.fillStyle = '#fbefd0'; lines.forEach((l, i) => ctx.fillText(l, cv.width / 2, 188 + i * 22)); ctx.globalAlpha = 1;
  }
  if (mode === 'play' && P.onGround) {
    const tab = nearTablet(), label = tab ? '▲ Read' : nearBench() ? '▲ Rest' : null;
    if (label) { const ax = tab ? tab.x + 12 : room.bench.x + 24, ay = tab ? tab.y - 14 : room.bench.y - 40;
      ctx.fillStyle = '#fbefd0'; ctx.font = '13px Georgia'; ctx.textAlign = 'center'; ctx.fillText(label, ax, ay); }
  }
}
function drawPickup(){
  const a = Math.min(1, pickup.t / 30), ab = ABIL[pickup.ab];
  ctx.fillStyle = `rgba(4,4,10,${0.82 * a})`; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.globalAlpha = a;
  glow(cv.width / 2, 220, 220, 'rgba(255,214,110,A)', 0.35);
  ctx.save(); ctx.translate(cv.width / 2, 220); ctx.rotate(frame * 0.01);
  ctx.strokeStyle = 'rgba(255,230,160,.5)'; ctx.lineWidth = 2;
  for (let i = 0; i < 12; i++) { ctx.rotate(Math.PI / 6); ctx.beginPath(); ctx.moveTo(40, 0); ctx.lineTo(90 + (i % 2) * 30, 0); ctx.stroke(); }
  ctx.restore();
  drawAbilityIcon(pickup.ab, cv.width / 2, 220, true);
  ctx.textAlign = 'center'; ctx.fillStyle = '#ffd36a'; ctx.font = '15px Georgia'; ctx.fillText('A NEW POWER AWAKENS', cv.width / 2, 330);
  ctx.fillStyle = '#fff8e8'; ctx.font = 'italic 44px Georgia'; ctx.fillText(ab.name, cv.width / 2, 380);
  ctx.fillStyle = '#e8dcc0'; ctx.font = '18px Georgia';
  wrap(ab.text, 560).forEach((l, i) => ctx.fillText(l, cv.width / 2, 418 + i * 24));
  ctx.fillStyle = '#ffd36a'; ctx.font = '15px Georgia'; ctx.fillText('Control: ' + ab.key, cv.width / 2, 478);
  if (pickup.t > 50) { ctx.globalAlpha = 0.5 + Math.sin(frame * 0.1) * 0.4; ctx.fillStyle = '#c8bca0'; ctx.fillText('Press jump or slash to continue', cv.width / 2, 512); }
  ctx.globalAlpha = 1;
}
function drawTitle(){
  ctx.fillStyle = '#07070f'; ctx.fillRect(0, 0, cv.width, cv.height);
  glow(cv.width / 2, cv.height + 60, 420, 'rgba(255,190,90,A)', 0.25 + Math.sin(frame * 0.02) * 0.05);
  for (let i = 0; i < 70; i++) {
    const x = (i * 157 + Math.sin(frame * 0.01 + i) * 30) % cv.width, y = cv.height - ((i * 89 + frame * (0.3 + (i % 4) * 0.2)) % cv.height);
    ctx.fillStyle = `rgba(255,${190 + (i % 3) * 20},100,${0.15 + (i % 5) * 0.08})`; circle(x, y, 1 + (i % 3));
  }
  ctx.textAlign = 'center'; ctx.fillStyle = '#fbefd0';
  ctx.font = 'italic 76px Georgia'; ctx.fillText('Lanternfall', cv.width / 2, 190);
  ctx.font = '18px Georgia'; ctx.fillStyle = '#c8b994';
  ctx.fillText('The sun lies buried. You are the last of its knights.', cv.width / 2, 230);
  const opts = titleOptions();
  opts.forEach((o, i) => {
    const sel = i === menuSel, y = 300 + i * 40;
    ctx.font = (sel ? 'italic ' : '') + '26px Georgia'; ctx.fillStyle = sel ? '#ffd36a' : '#8a8070';
    ctx.fillText(o, cv.width / 2, y);
    if (sel) { drawFlame(cv.width / 2 - ctx.measureText(o).width / 2 - 22, y - 2, 0.6, '#ffb347', '#fff0c0'); }
  });
  ctx.fillStyle = '#7d7466'; ctx.font = '15px Georgia';
  ctx.fillText('↑ ↓ choose · Enter / Z / tap to confirm', cv.width / 2, 300 + opts.length * 40 + 6);
  ctx.fillText('Move: Arrows / WASD   Jump: Z / Space   Slash: X / J   Heal: hold F', cv.width / 2, 470);
  ctx.fillText('Hold ↑ or ↓ while slashing to aim. Strike down onto foes or thorns to bounce.', cv.width / 2, 494);
}
function drawWin(){
  ctx.fillStyle = '#fff8e6'; ctx.fillRect(0, 0, cv.width, cv.height);
  glow(cv.width / 2, cv.height, 500, 'rgba(255,190,90,A)', 0.6);
  ctx.textAlign = 'center'; ctx.fillStyle = '#5a3a10';
  ctx.font = 'italic 54px Georgia'; ctx.fillText('Dawn returns', cv.width / 2, 190);
  ctx.font = '19px Georgia'; ctx.fillStyle = '#6a5030';
  wrap('The Umbral Knight breaks apart, and the stolen light pours back into the earth. Far below, the old sun stirs and rises. Its last knight goes with it.', 620)
    .forEach((l, i) => ctx.fillText(l, cv.width / 2, 240 + i * 26));
  const s = Math.floor(playFrames / 60);
  ctx.fillStyle = '#3a2a10'; ctx.font = '18px Georgia';
  ctx.fillText(`Time ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}   ·   Embers ${P.embers}   ·   Heart vessels ${P.maxHp}`, cv.width / 2, 350);
  ctx.fillStyle = '#8a6a40'; ctx.font = '16px Georgia'; ctx.fillText('Thank you for playing. Press Enter or tap to return to the title.', cv.width / 2, 410);
}
function draw(){
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (mode === 'title') { drawTitle(); return; }
  if (mode === 'win') { drawWin(); return; }
  const sx = shake ? (Math.random() - 0.5) * shake : 0, sy = shake ? (Math.random() - 0.5) * shake : 0;
  ctx.setTransform(1, 0, 0, 1, sx, sy);
  ctx.drawImage(bgCanvas, 0, 0);
  for (let i = 0; i < 30; i++) {
    const x = (i * 211 + frame * 0.15 * (1 + i % 4)) % cv.width, y = (i * 97 + Math.sin(frame * 0.012 + i) * 30 + 600) % cv.height;
    ctx.fillStyle = `hsla(${room.def.hue + 30},60%,75%,${0.08 + (i % 4) * 0.04})`; ctx.fillRect(x, y, 2, 2);
  }
  ctx.drawImage(tileCanvas, 0, 0);
  drawDynamicTiles();
  items.forEach(drawItem);
  room.ents.forEach(drawEnt);
  drawPlayer(); drawSlash(); drawLances();
  for (const p of particles) { ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.color; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); }
  ctx.globalAlpha = 1;
  // the knight is the only light in the dark; each power widens it
  const lx = P.x + P.w / 2, ly = P.y + P.h / 2;
  const lr = 230 + 55 * Object.values(P.has).filter(Boolean).length;
  const g = ctx.createRadialGradient(lx, ly, lr * 0.3, lx, ly, lr * 1.7);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,6,.78)');
  ctx.fillStyle = g; ctx.fillRect(-20, -20, cv.width + 40, cv.height + 40);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  drawHUD();
  if (mode === 'dead') {
    ctx.fillStyle = `rgba(0,0,0,${1 - deadT / 120})`; ctx.fillRect(0, 0, cv.width, cv.height);
    if (deadT < 80) { ctx.fillStyle = '#c8b994'; ctx.font = 'italic 26px Georgia'; ctx.textAlign = 'center'; ctx.fillText('Your light gutters, but does not go out.', cv.width / 2, cv.height / 2); }
  }
  if (fadeIn > 0) { ctx.fillStyle = `rgba(0,0,0,${fadeIn})`; ctx.fillRect(0, 0, cv.width, cv.height); }
  if (flash > 0) { ctx.fillStyle = `rgba(255,248,225,${flash})`; ctx.fillRect(0, 0, cv.width, cv.height); }
  if (mode === 'pickup') drawPickup();
}

// test hook (harmless in play)
window.__lf = { P, get room(){ return room; }, loadRoom, get mode(){ return mode; }, flags: () => flags };

let acc = 0, last = performance.now();
function loop(now){
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { step(); acc -= 1000 / 60; }
  draw(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
