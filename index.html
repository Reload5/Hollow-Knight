<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Lanternfall</title>
<meta name="description" content="Lanternfall - a small original metroidvania in a single HTML file.">
<style>
  html,body{margin:0;height:100%;background:#05070d;overflow:hidden;font-family:Georgia,'Times New Roman',serif;color:#cfe3ea;touch-action:none;user-select:none;-webkit-user-select:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{background:#0a0f1a;box-shadow:0 0 60px #000}
  #tc{display:none;position:fixed;left:0;right:0;bottom:0;padding:12px 16px;justify-content:space-between;align-items:flex-end;pointer-events:none}
  #tc .grp{display:grid;gap:8px;pointer-events:auto}
  #tc .pad{grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,56px)}
  #tc .act{grid-template-columns:repeat(2,64px);grid-template-rows:repeat(2,56px)}
  #tc button{border:1px solid #ffffff33;border-radius:14px;background:#ffffff14;color:#e8f2f5;font:600 14px Georgia,serif;touch-action:none}
  #tc button:active,#tc button.on{background:#ffc45a44}
  @media (pointer:coarse){#tc{display:flex}}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="tc">
  <div class="grp pad">
    <span></span><button data-k="up">▲</button><span></span>
    <button data-k="left">◀</button><button data-k="down">▼</button><button data-k="right">▶</button>
  </div>
  <div class="grp act">
    <button data-k="heal">Heal</button><button data-k="dash">Dash</button>
    <button data-k="attack">Slash</button><button data-k="jump">Jump</button>
  </div>
</div>
<script>
(() => {
'use strict';
const T = 32, W = 30, H = 17;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
cv.width = W * T; cv.height = H * T;
function fit() {
  const s = Math.min(innerWidth / cv.width, innerHeight / cv.height);
  cv.style.width = cv.width * s + 'px'; cv.style.height = cv.height * s + 'px';
}
addEventListener('resize', fit); fit();

/* ---------- World ----------
  # rock   ^ spikes   = grate (enemies only)   P start   B bench
  C crawler   F flyer   S sentinel (boss)   o ember   H heart   */
const ROOMS = {
  '0,0': { name: 'Quiet Hollow', hue: 205, map: [
    '##############################',
    '#............................#',
    '#............................#',
    '#............................#',
    '#............................#',
    '#.....................o......#',
    '#...................#####....#',
    '#............................#',
    '#............................#',
    '#.............#####..........#',
    '#............................#',
    '#............................#',
    '#.......####..................',
    '#...B.........................',
    '#.P...........................',
    '##############################',
    '##############################']},
  '1,0': { name: 'Thorn Passage', hue: 160, map: [
    '##############################',
    '#............................#',
    '#............................#',
    '#............................#',
    '#............................#',
    '#..................o.........#',
    '#.................####.......#',
    '#............................#',
    '#..........o.................#',
    '#.........####...............#',
    '#............................#',
    '#......................F.....#',
    '...............####...........',
    '..............................',
    '.......C..................C...',
    '##########^^^^################',
    '##############################']},
  '2,0': { name: 'The Long Shaft', hue: 265, map: [
    '#############....#############',
    '#############....#############',
    '#.........................H..#',
    '#...........#######....#####.#',
    '#............................#',
    '#............................#',
    '#...####............####.....#',
    '#............................#',
    '#............................#',
    '#.............#####..........#',
    '#............................#',
    '#.....F..............o.......#',
    '.....................####....#',
    '.............................#',
    '..........C..................#',
    '##############################',
    '##############################']},
  '2,-1': { name: "Sentinel's Rest", hue: 18, map: [
    '##############################',
    '#............................#',
    '#............................#',
    '#............................#',
    '#............................#',
    '#............................#',
    '#............................#',
    '#............................#',
    '#............................#',
    '#............................#',
    '#............................#',
    '#............................#',
    '#....####............####....#',
    '#............................#',
    '#......................S.....#',
    '#############====#############',
    '#############====#############']},
};
const BOSS_ROOM = '2,-1';

/* ---------- Input ---------- */
const keys = {}, pressed = {};
const KEYMAP = {ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',
  KeyZ:'jump',Space:'jump',KeyX:'attack',KeyJ:'attack',KeyC:'dash',KeyK:'dash',ShiftLeft:'dash',ShiftRight:'dash',KeyF:'heal',KeyL:'heal',Enter:'start'};
function press(a){ if(!keys[a]) pressed[a] = true; keys[a] = true; initAudio(); }
function release(a){ keys[a] = false; }
addEventListener('keydown', e => { const a = KEYMAP[e.code]; if (a) { e.preventDefault(); press(a); } });
addEventListener('keyup', e => { const a = KEYMAP[e.code]; if (a) release(a); });
document.querySelectorAll('#tc button').forEach(b => {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', e => { e.preventDefault(); b.setPointerCapture(e.pointerId); b.classList.add('on'); press(k); });
  const up = () => { b.classList.remove('on'); release(k); };
  b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('lostpointercapture', up);
});
cv.addEventListener('pointerdown', () => { if (mode === 'title' || mode === 'win') press('start'); setTimeout(() => release('start'), 50); });

/* ---------- Audio ---------- */
let AC = null;
function initAudio(){ if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } }
function sfx(f, d = 0.1, type = 'square', v = 0.04, f2) {
  if (!AC) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d);
}

/* ---------- State ---------- */
const roomState = {};
const st = k => roomState[k] || (roomState[k] = { dead: new Set(), got: new Set() });
let bossDead = false, mode = 'title', frame = 0, playFrames = 0;
let room, bgCanvas, tileCanvas, particles = [], items = [];
let shake = 0, hitstop = 0, banner = null, msg = null, deadT = 0, fadeIn = 0;
let spawn = null;

const P = { x:0,y:0,w:18,h:28,vx:0,vy:0,face:1,onGround:false,coyote:0,jumpBuf:0,jumping:false,wallLock:0,
  dashT:0,dashCd:0,canDash:true,atkT:0,atkCd:0,atkDir:'side',hits:null,hp:5,maxHp:5,glow:0,inv:0,healT:0,embers:0,knock:0,safeX:0,safeY:0 };

/* ---------- Tiles & collision ---------- */
function tileAt(tx, ty){ return (ty >= 0 && ty < H && tx >= 0 && tx < W) ? room.tiles[ty][tx] : null; }
function isSolid(tx, ty, enemy){
  const t = tileAt(tx, ty);
  if (t === null) {
    if (enemy) return true;
    if (ty >= 0 && ty < H) return !ROOMS[(room.rx + (tx < 0 ? -1 : 1)) + ',' + room.ry];
    if (tx >= 0 && tx < W) return !ROOMS[room.rx + ',' + (room.ry + (ty < 0 ? -1 : 1))];
    return true;
  }
  return t === '#' || (enemy && t === '=');
}
function collides(x, y, w, h, enemy){
  const x0 = Math.floor(x / T), x1 = Math.floor((x + w - 0.01) / T), y0 = Math.floor(y / T), y1 = Math.floor((y + h - 0.01) / T);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) if (isSolid(tx, ty, enemy)) return true;
  return false;
}
function move(b, dx, dy, enemy){
  let hx = 0, hy = 0;
  b.x += dx;
  if (dx && collides(b.x, b.y, b.w, b.h, enemy)) {
    if (dx > 0) b.x = Math.floor((b.x + b.w - 0.01) / T) * T - b.w; else b.x = (Math.floor(b.x / T) + 1) * T;
    hx = Math.sign(dx);
  }
  b.y += dy;
  if (dy && collides(b.x, b.y, b.w, b.h, enemy)) {
    if (dy > 0) b.y = Math.floor((b.y + b.h - 0.01) / T) * T - b.h; else b.y = (Math.floor(b.y / T) + 1) * T;
    hy = Math.sign(dy);
  }
  return { hx, hy };
}
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
function touchesSpike(b){
  const x0 = Math.floor(b.x / T), x1 = Math.floor((b.x + b.w - 0.01) / T), y0 = Math.floor(b.y / T), y1 = Math.floor((b.y + b.h - 0.01) / T);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++)
    if (tileAt(tx, ty) === '^' && overlap(b, { x: tx * T + 2, y: ty * T + 12, w: T - 4, h: T - 12 })) return true;
  return false;
}

/* ---------- Rooms ---------- */
function rng(seed){ let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
function hashStr(s){ let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; }

function mkEnt(type, tx, ty, id){
  const sz = { crawler: [26, 20, 3], flyer: [24, 20, 2], boss: [64, 60, 24] }[type];
  const e = { type, id, w: sz[0], h: sz[1], hp: sz[2], maxHp: sz[2], vx: 0, vy: 0, kx: 0, ky: 0, flash: 0, dir: -1, face: -1, seed: Math.random() * 10, state: 'sleep', t: 0 };
  e.x = tx * T + (T - e.w) / 2; e.y = (ty + 1) * T - e.h;
  return e;
}
function loadRoom(key){
  const def = ROOMS[key], [rx, ry] = key.split(',').map(Number), s = st(key);
  room = { key, rx, ry, def, tiles: def.map.map(r => r.split('')), ents: [], bench: null, start: null };
  items = []; particles = [];
  def.map.forEach((row, ty) => [...row].forEach((c, tx) => {
    if ('#^=.'.includes(c)) return;
    const id = tx + ',' + ty;
    room.tiles[ty][tx] = '.';
    if (c === 'C' && !s.dead.has(id)) room.ents.push(mkEnt('crawler', tx, ty, id));
    if (c === 'F' && !s.dead.has(id)) room.ents.push(mkEnt('flyer', tx, ty, id));
    if (c === 'S' && !bossDead) room.ents.push(mkEnt('boss', tx, ty, id));
    if (c === 'B') room.bench = { x: tx * T - 8, y: ty * T + 14, w: 48, h: 18 };
    if (c === 'P') room.start = { x: tx * T + 7, y: (ty + 1) * T - P.h };
    if (c === 'o' && !s.got.has(id)) items.push({ kind: 'ember', id, x: tx * T + 9, y: ty * T + 9, w: 14, h: 14 });
    if (c === 'H' && !s.got.has(id)) items.push({ kind: 'heart', id, x: tx * T + 6, y: ty * T + 6, w: 20, h: 20 });
  }));
  if (key === BOSS_ROOM && bossDead) spawnRelic();
  buildCanvases();
  banner = { text: def.name, t: 150 };
}
function spawnRelic(){ items.push({ kind: 'relic', x: 22 * T + 4, y: 12 * T, w: 24, h: 24 }); }

function buildCanvases(){
  const hue = room.def.hue, r = rng(hashStr(room.key));
  bgCanvas = document.createElement('canvas'); bgCanvas.width = cv.width; bgCanvas.height = cv.height;
  const b = bgCanvas.getContext('2d');
  const g = b.createLinearGradient(0, 0, 0, cv.height);
  g.addColorStop(0, `hsl(${hue},35%,9%)`); g.addColorStop(1, `hsl(${hue},30%,4%)`);
  b.fillStyle = g; b.fillRect(0, 0, cv.width, cv.height);
  for (let layer = 0; layer < 2; layer++) {
    b.fillStyle = `hsla(${hue},30%,${layer ? 11 : 7}%,1)`;
    for (let i = 0; i < 14; i++) {
      const x = r() * cv.width, w = 30 + r() * 80, h = 60 + r() * 200 * (layer ? 0.6 : 1);
      b.beginPath(); b.moveTo(x - w / 2, 0); b.lineTo(x, h); b.lineTo(x + w / 2, 0); b.fill();
      const h2 = 40 + r() * 160 * (layer ? 0.6 : 1);
      b.beginPath(); b.moveTo(x - w / 2 + 40, cv.height); b.lineTo(x + 40, cv.height - h2); b.lineTo(x + w / 2 + 40, cv.height); b.fill();
    }
  }
  tileCanvas = document.createElement('canvas'); tileCanvas.width = cv.width; tileCanvas.height = cv.height;
  const c = tileCanvas.getContext('2d');
  const solid = (tx, ty) => { const t = tileAt(tx, ty); return t === null || t === '#'; };
  for (let ty = 0; ty < H; ty++) for (let tx = 0; tx < W; tx++) {
    const t = room.tiles[ty][tx], x = tx * T, y = ty * T;
    if (t === '#') {
      c.fillStyle = `hsl(${hue},18%,${9 + r() * 2}%)`; c.fillRect(x, y, T, T);
      c.fillStyle = `hsla(${hue},20%,4%,.6)`;
      for (let i = 0; i < 3; i++) c.fillRect(x + r() * 26, y + r() * 26, 3 + r() * 5, 2 + r() * 3);
      if (!solid(tx, ty - 1)) {
        c.fillStyle = `hsl(${hue},25%,26%)`; c.fillRect(x, y, T, 4);
        c.fillStyle = `hsl(${hue + 40},45%,38%)`;
        for (let i = 0; i < 4; i++) { const gx = x + r() * 30; c.fillRect(gx, y - 3 - r() * 4, 2, 6); }
      }
      if (!solid(tx - 1, ty)) { c.fillStyle = `hsl(${hue},20%,17%)`; c.fillRect(x, y, 2, T); }
      if (!solid(tx + 1, ty)) { c.fillStyle = `hsl(${hue},20%,17%)`; c.fillRect(x + T - 2, y, 2, T); }
      if (!solid(tx, ty + 1)) { c.fillStyle = `hsl(${hue},20%,5%)`; c.fillRect(x, y + T - 3, T, 3); }
    } else if (t === '^') {
      c.fillStyle = '#cfdbe2';
      for (let i = 0; i < 4; i++) { c.beginPath(); c.moveTo(x + i * 8, y + T); c.lineTo(x + i * 8 + 4, y + 10); c.lineTo(x + i * 8 + 8, y + T); c.fill(); }
    } else if (t === '=') {
      c.fillStyle = `hsla(${hue},60%,50%,.05)`; c.fillRect(x, y, T, T);
    }
  }
  if (room.bench) {
    const bn = room.bench;
    c.fillStyle = '#5b4632'; c.fillRect(bn.x, bn.y, bn.w, 5); c.fillRect(bn.x + 4, bn.y + 5, 4, 13); c.fillRect(bn.x + bn.w - 8, bn.y + 5, 4, 13);
    c.fillStyle = '#7a5f43'; c.fillRect(bn.x, bn.y - 10, bn.w, 4);
  }
}

/* ---------- Particles ---------- */
function burst(x, y, n, color, spd = 4, life = 30, grav = 0.15, size = 3){
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = Math.random() * spd;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: life * (0.5 + Math.random() * 0.5), max: life, color, grav, size });
  }
}
function dropEmbers(x, y, n){
  for (let i = 0; i < n; i++) items.push({ kind: 'drop', x, y, w: 8, h: 8, vx: (Math.random() - 0.5) * 6, vy: -3 - Math.random() * 4, age: 0 });
}

/* ---------- Player ---------- */
function startGame(){
  for (const k in roomState) delete roomState[k];
  bossDead = false; playFrames = 0;
  Object.assign(P, { hp: 5, maxHp: 5, glow: 0, embers: 0, vx: 0, vy: 0, face: 1, inv: 0, knock: 0, dashT: 0, atkT: 0 });
  loadRoom('0,0');
  P.x = room.start.x; P.y = room.start.y; P.safeX = P.x; P.safeY = P.y;
  spawn = { key: '0,0', x: P.x, y: P.y };
  mode = 'play'; fadeIn = 1;
  msg = { text: 'Arrows/WASD move · Z jump · X slash · C dash · F heal · ↑ at a bench to rest', t: 420 };
}
function respawnAll(){ for (const k in roomState) roomState[k].dead.clear(); }
function respawn(){
  respawnAll();
  loadRoom(spawn.key);
  Object.assign(P, { x: spawn.x, y: spawn.y, vx: 0, vy: 0, hp: P.maxHp, glow: 0, inv: 60, knock: 0, dashT: 0, atkT: 0, healT: 0 });
  P.safeX = P.x; P.safeY = P.y; mode = 'play'; fadeIn = 1;
}
function hurt(fromX){
  if (P.inv > 0 || mode !== 'play') return false;
  P.hp--; P.inv = 75; P.vy = -7; P.knock = (P.x + P.w / 2 < fromX ? -7 : 7); P.dashT = 0; P.healT = 0;
  shake = 12; hitstop = 8; sfx(160, 0.3, 'sawtooth', 0.06, 50);
  burst(P.x + P.w / 2, P.y + P.h / 2, 14, '#e8f4f8', 5, 30);
  if (P.hp <= 0) { mode = 'dead'; deadT = 110; burst(P.x + P.w / 2, P.y + P.h / 2, 40, '#ffc45a', 6, 60); }
  return true;
}
function goRoom(dx, dy){
  const k = (room.rx + dx) + ',' + (room.ry + dy);
  if (!ROOMS[k]) return;
  loadRoom(k);
  if (dx === 1) P.x = 2;
  if (dx === -1) P.x = W * T - P.w - 2;
  if (dy === -1) { P.y = H * T - P.h - 2; P.vy = -13.5; }
  if (dy === 1) P.y = 2;
  P.safeX = P.x; P.safeY = P.y; P.canDash = true;
}
function attackBox(){
  if (P.atkDir === 'up') return { x: P.x - 12, y: P.y - 44, w: 42, h: 46 };
  if (P.atkDir === 'down') return { x: P.x - 12, y: P.y + P.h - 2, w: 42, h: 44 };
  return P.face > 0 ? { x: P.x + P.w - 2, y: P.y - 6, w: 46, h: 38 } : { x: P.x - 44, y: P.y - 6, w: 46, h: 38 };
}

function updatePlayer(){
  const inX = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  const wallL = collides(P.x - 1, P.y + 2, P.w, P.h - 4), wallR = collides(P.x + 1, P.y + 2, P.w, P.h - 4);
  const wallDir = P.onGround ? 0 : (wallR ? 1 : wallL ? -1 : 0);

  if (P.inv > 0) P.inv--;
  if (P.dashCd > 0) P.dashCd--;
  if (P.atkCd > 0) P.atkCd--;
  if (P.wallLock > 0) P.wallLock--;
  if (P.coyote > 0) P.coyote--;
  if (P.jumpBuf > 0) P.jumpBuf--;
  if (pressed.jump) P.jumpBuf = 8;

  // heal
  const canHeal = keys.heal && P.onGround && P.glow >= 3 && P.hp < P.maxHp && P.atkT === 0 && P.dashT === 0;
  if (canHeal) {
    P.healT++; if (frame % 6 === 0) burst(P.x + P.w / 2, P.y + P.h, 2, '#ffc45a', 1.5, 30, -0.08, 2);
    if (P.healT >= 50) { P.hp++; P.glow -= 3; P.healT = 0; burst(P.x + P.w / 2, P.y + P.h / 2, 24, '#ffd98a', 4, 40, -0.05); sfx(520, 0.4, 'sine', 0.06, 880); }
  } else P.healT = 0;

  if (P.healT === 0 && inX && P.wallLock === 0 && P.dashT === 0) P.face = inX;

  // dash
  if (pressed.dash && P.dashCd === 0 && P.canDash && P.healT === 0) {
    P.dashT = 11; P.dashCd = 28; if (!P.onGround) P.canDash = false; if (inX) P.face = inX;
    sfx(300, 0.15, 'triangle', 0.04, 120);
  }
  // attack
  if (pressed.attack && P.atkCd === 0 && P.healT === 0) {
    P.atkT = 12; P.atkCd = 20; P.hits = new Set();
    P.atkDir = keys.up ? 'up' : (keys.down && !P.onGround ? 'down' : 'side');
    sfx(900, 0.08, 'square', 0.025, 300);
  }

  let dx, dy;
  if (P.dashT > 0) {
    P.dashT--; P.vy = 0; dx = P.face * 10; dy = 0;
    if (frame % 2 === 0) particles.push({ x: P.x + P.w / 2, y: P.y + P.h / 2, vx: 0, vy: 0, life: 14, max: 14, color: '#5fd6cf', grav: 0, size: 6 });
  } else {
    const target = P.healT ? 0 : inX * 4.2;
    P.vx = P.wallLock > 0 ? P.vx + (target - P.vx) * 0.12 : target;
    P.vy = Math.min(P.vy + 0.6, 14);
    // wall slide
    if (wallDir && P.vy > 0 && inX === wallDir) {
      P.vy = Math.min(P.vy, 2.2);
      if (frame % 5 === 0) particles.push({ x: P.x + (wallDir > 0 ? P.w : 0), y: P.y + P.h - 4, vx: -wallDir, vy: -0.5, life: 16, max: 16, color: '#8aa', grav: 0, size: 2 });
    }
    // jumping
    if (P.jumpBuf > 0 && P.healT === 0) {
      if (P.coyote > 0) {
        P.vy = -12.2; P.jumping = true; P.coyote = 0; P.jumpBuf = 0; sfx(380, 0.12, 'triangle', 0.04, 620);
      } else if (wallDir) {
        P.vy = -11.5; P.vx = -wallDir * 6.5; P.wallLock = 10; P.face = -wallDir; P.jumping = true; P.jumpBuf = 0; P.canDash = true;
        sfx(440, 0.12, 'triangle', 0.04, 700);
        burst(P.x + (wallDir > 0 ? P.w : 0), P.y + P.h / 2, 6, '#9bb', 2, 18);
      }
    }
    if (!keys.jump && P.jumping && P.vy < -3) { P.vy = -3; P.jumping = false; }
    if (P.vy >= 0) P.jumping = false;
    dx = P.vx + P.knock; dy = P.vy;
  }
  P.knock *= 0.82; if (Math.abs(P.knock) < 0.1) P.knock = 0;

  const wasGround = P.onGround;

function pogo(){ P.vy = -10.5; P.jumping = false; P.canDash = true; }

/* ---------- Enemies ---------- */
function wakeBoss(e){
  e.state = 'roar'; e.t = 70; shake = 22;
  banner = { text: 'The Rusted Sentinel', t: 170 };
  sfx(70, 0.8, 'sawtooth', 0.08, 35);

function updateEnts(){
  const pcx = P.x + P.w / 2, pcy = P.y + P.h / 2;
  for (const e of room.ents) {
    if (e.dead) continue;
    if (e.flash > 0) e.flash--;
    const ecx = e.x + e.w / 2, ecy = e.y + e.h / 2;
    if (e.type === 'crawler') {
      e.vy = Math.min(e.vy + 0.6, 12); e.kx *= 0.8;
      const r = move(e, e.dir * 1.1 + e.kx, e.vy, true);
      if (r.hy) e.vy = 0;
      if (r.hx) e.dir *= -1;
      else if (r.hy > 0) {
        const fx = e.dir > 0 ? e.x + e.w + 2 : e.x - 2;
        if (!isSolid(Math.floor(fx / T), Math.floor((e.y + e.h + 4) / T), true)) e.dir *= -1;
      }
    } else if (e.type === 'flyer') {
      const dx = pcx - ecx, dy = pcy - ecy, d = Math.hypot(dx, dy) || 1;
      if (d < 330) { e.vx += dx / d * 0.13; e.vy += dy / d * 0.13; }
      else e.vy += Math.sin(frame * 0.05 + e.seed) * 0.04;
      const sp = Math.hypot(e.vx, e.vy); if (sp > 2.4) { e.vx *= 2.4 / sp; e.vy *= 2.4 / sp; }
      e.vx *= 0.985; e.vy *= 0.985;

      if (r.hx) e.vx *= -0.5; if (r.hy) e.vy *= -0.5;
      e.kx *= 0.85; e.ky *= 0.85;
    } else if (e.type === 'boss') {

      let dx = 0;
      switch (e.state) {
        case 'sleep': if (Math.abs(pcx - ecx) < 420 && Math.abs(pcy - ecy) < 200) wakeBoss(e); break;
        case 'roar': if (--e.t <= 0) { e.state = 'idle'; e.t = 30; } break;
        case 'idle': e.face = pcx < ecx ? -1 : 1; if (--e.t <= 0) { e.state = Math.random() < 0.5 ? 'tcharge' : 'tleap'; e.t = enr ? 18 : 30; } break;
        case 'tcharge': if (--e.t <= 0) { e.state = 'charge'; e.vx = e.face * (enr ? 10 : 8); sfx(90, 0.3, 'sawtooth', 0.05, 60); } break;
        case 'charge': dx = e.vx; if (frame % 3 === 0) burst(ecx, e.y + e.h, 2, '#8a6a50', 2, 16); break;
        case 'tleap': if (--e.t <= 0) { e.state = 'leap'; e.vy = -14; e.vx = Math.max(-7, Math.min(7, (pcx - ecx) / 42)); } break;
        case 'leap': dx = e.vx; break;

          e.state = 'idle'; e.t = enr ? 30 : 45; shake = 14; e.vx = 0; sfx(60, 0.4, 'sawtooth', 0.07, 30);
          for (const s of [-1, 1]) room.ents.push({ type: 'wave', x: ecx - 9, y: e.y + e.h - 22, w: 18, h: 22, vx: s * (enr ? 7.5 : 6.5), life: 140 });
          burst(ecx, e.y + e.h, 20, '#8a6a50', 5, 30);

      if (r.hx && e.state === 'charge') { e.state = 'idle'; e.t = enr ? 35 : 55; shake = 12; e.vx = 0; burst(ecx + e.face * 32, ecy, 16, '#8a6a50', 4, 26); sfx(80, 0.3, 'square', 0.05, 40); }
    } else if (e.type === 'wave') {

  }
  room.ents = room.ents.filter(e => !e.dead);
}

/* ---------- Items ---------- */
function updateItems(){
  for (const it of items) {
    if (it.kind === 'drop') {
      it.age++;
      const dx = P.x + P.w / 2 - it.x, dy = P.y + P.h / 2 - it.y, d = Math.hypot(dx, dy);
      if (it.age > 25 && d < 90) { it.x += dx / d * 6; it.y += dy / d * 6; }
      else {
        it.vy = Math.min(it.vy + 0.4, 9); it.vx *= 0.97;
        const r = move(it, it.vx, it.vy, true);
        if (r.hy > 0) { it.vy *= -0.4; it.vx *= 0.7; } if (r.hx) it.vx *= -0.6;
      }
      if (it.age > 15 && overlap(P, it)) { it.gone = true; P.embers++; sfx(1300 + Math.random() * 300, 0.06, 'sine', 0.03); }
    } else if (overlap(P, it)) {
      it.gone = true;
      if (it.kind === 'ember') { st(room.key).got.add(it.id); P.embers += 5; sfx(1100, 0.2, 'sine', 0.04, 1600); burst(it.x + 7, it.y + 7, 14, '#ffb347', 3, 30); }
      if (it.kind === 'heart') {

        burst(it.x + 10, it.y + 10, 30, '#ff7a6a', 4, 50); msg = { text: 'Ember Heart found! Your maximum health increases.', t: 240 };
      }
      if (it.kind === 'relic') { mode = 'win'; sfx(330, 1.2, 'sine', 0.07, 990); }

}

/* ---------- Step ---------- */
function step(){
  frame++;
  if (mode === 'title') { if (pressed.start || pressed.jump || pressed.attack) startGame(); }
  else if (mode === 'win') { if (pressed.start) mode = 'title'; }
  else if (hitstop > 0) hitstop--;
  else {
    if (mode === 'play') { playFrames++; updatePlayer(); }
    if (mode === 'dead' && --deadT <= 0) respawn();
    if (mode !== 'title') { updateEnts(); updateItems(); }
  }
  for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy += p.grav; p.vx *= 0.96; p.life--; }
  particles = particles.filter(p => p.life > 0);
  if (shake > 0) shake *= 0.85; if (shake < 0.3) shake = 0;
  if (banner && --banner.t <= 0) banner = null;
  if (msg && --msg.t <= 0) msg = null;
  if (fadeIn > 0) fadeIn = Math.max(0, fadeIn - 0.04);
  for (const k in pressed) delete pressed[k];
}

}
function drawWin(){
  ctx.fillStyle = 'rgba(5,7,13,.85)'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.textAlign = 'center'; ctx.fillStyle = '#ffe9b0';
  ctx.font = 'italic 56px Georgia'; ctx.fillText('The flame is rekindled', cv.width / 2, 210);
  const s = Math.floor(playFrames / 60);
  ctx.fillStyle = '#cfe3ea'; ctx.font = '20px Georgia';
  ctx.fillText(`Time ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}   ·   Embers ${P.embers}   ·   Health ${P.maxHp}`, cv.width / 2, 270);
  ctx.fillStyle = '#9fb5bf'; ctx.font = '18px Georgia'; ctx.fillText('Thanks for playing. Press Enter or tap to return to the title.', cv.width / 2, 340);
}
function draw(){
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (mode === 'title') { drawTitle(); return; }
  const sx = shake ? (Math.random() - 0.5) * shake : 0, sy = shake ? (Math.random() - 0.5) * shake : 0;
  ctx.setTransform(1, 0, 0, 1, sx, sy);
  ctx.drawImage(bgCanvas, 0, 0);
  // dust
  for (let i = 0; i < 30; i++) {
    const x = (i * 211 + frame * 0.15 * (1 + i % 4)) % cv.width, y = (i * 97 + Math.sin(frame * 0.012 + i) * 30 + 600) % cv.height;
    ctx.fillStyle = `hsla(${room.def.hue + 30},60%,75%,${0.08 + (i % 4) * 0.04})`; ctx.fillRect(x, y, 2, 2);
  }
  ctx.drawImage(tileCanvas, 0, 0);
  items.forEach(drawItem);
  room.ents.forEach(drawEnt);
  drawPlayer(); drawSlash();
  for (const p of particles) { ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.color; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); }
  ctx.globalAlpha = 1;
  // lantern light vignette
  const lx = P.x + P.w / 2, ly = P.y + P.h / 2;
  const g = ctx.createRadialGradient(lx, ly, 60, lx, ly, 520);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.6)');
  ctx.fillStyle = g; ctx.fillRect(-20, -20, cv.width + 40, cv.height + 40);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  drawHUD();
  if (mode === 'dead') { ctx.fillStyle = `rgba(0,0,0,${1 - deadT / 110})`; ctx.fillRect(0, 0, cv.width, cv.height); }
  if (fadeIn > 0) { ctx.fillStyle = `rgba(0,0,0,${fadeIn})`; ctx.fillRect(0, 0, cv.width, cv.height); }
  if (mode === 'win') drawWin();
}

let acc = 0, last = performance.now();
function loop(now){
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { step(); acc -= 1000 / 60; }
  draw(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
