<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Lanternfall</title>
<meta name="description" content="Lanternfall - an original metroidvania about the last knight of light. Single HTML file.">
<style>
  html,body{margin:0;height:100%;background:#05060c;overflow:hidden;font-family:Georgia,'Times New Roman',serif;color:#f1e6c8;touch-action:none;user-select:none;-webkit-user-select:none;color-scheme:dark}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{background:#090a14;box-shadow:0 0 60px #000}
  #tc{display:none;position:fixed;left:0;right:0;bottom:0;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));justify-content:space-between;align-items:flex-end;pointer-events:none}
  body.touch #tc{display:flex}
  #tc .pad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,58px);gap:6px;pointer-events:auto}
  #tc .act{position:relative;width:196px;height:172px;pointer-events:auto}
  #tc button{border:1.5px solid rgba(255,215,122,.38);background:radial-gradient(circle at 50% 30%,rgba(255,226,150,.2),rgba(14,12,24,.6) 70%);color:#fbefd0;font:600 10px Georgia,serif;letter-spacing:.08em;text-transform:uppercase;touch-action:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 4px 18px rgba(0,0,0,.45),inset 0 0 12px rgba(255,214,110,.08);transition:transform .06s,background .06s;-webkit-tap-highlight-color:transparent;padding:0}
  #tc .pad button{border-radius:16px;font-size:18px}
  #tc .act button{position:absolute;border-radius:50%}
  #tc button.on{background:radial-gradient(circle,rgba(255,220,130,.65),rgba(255,170,70,.25) 75%);transform:scale(.93);box-shadow:0 0 22px rgba(255,200,100,.45)}
  #tc .b-jump{width:80px;height:80px;right:0;bottom:0}
  #tc .b-attack{width:68px;height:68px;right:90px;bottom:4px}
  #tc .b-dash{width:58px;height:58px;right:10px;bottom:92px}
  #tc .b-heal{width:54px;height:54px;right:86px;bottom:84px}
  #tc svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
</style>

<div id="wrap"><canvas id="c"></canvas></div>

    <button data-k="left" aria-label="Left">◀</button><button data-k="down" aria-label="Down">▼</button><button data-k="right" aria-label="Right">▶</button>
  </div>
  <div class="act">
    <button class="b-heal" data-k="heal"><svg viewBox="0 0 24 24"><path d="M12 3c3 4 6 6.5 6 10.5a6 6 0 0 1-12 0C6 9.5 9 7 12 3z"/></svg>Heal</button>
    <button class="b-dash" data-k="dash"><svg viewBox="0 0 24 24"><path d="M5 6l6 6-6 6M13 6l6 6-6 6"/></svg>Dash</button>
    <button class="b-attack" data-k="attack"><svg viewBox="0 0 24 24"><path d="M5 19L19 5M14 5h5v5M4 14c2 4 6 6 10 5"/></svg>Slash</button>
    <button class="b-jump" data-k="jump"><svg viewBox="0 0 24 24"><path d="M6 14l6-6 6 6M6 19l6-6 6 6"/></svg>Jump</button>
  </div>
</div>
<script>
(() => {
'use strict';
const T = 32, W = 30, H = 17;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const VW = W * T, VH = H * T;
const DPR = Math.max(1, Math.min(2, Math.ceil((window.devicePixelRatio || 1) * Math.max(1, Math.min(innerWidth / VW, innerHeight / VH)))));
cv.width = VW * DPR; cv.height = VH * DPR;
function fit(){ const s = Math.min(innerWidth / VW, innerHeight / VH); cv.style.width = VW * s + 'px'; cv.style.height = VH * s + 'px'; }
addEventListener('resize', fit); fit();
function mkCanvas(w = VW, h = VH){ const c = document.createElement('canvas'); c.width = Math.ceil(w * DPR); c.height = Math.ceil(h * DPR); const x = c.getContext('2d'); x.scale(DPR, DPR); return [c, x]; }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* =====================================================================
   WORLD
   # rock   ^ thorns   = grate (blocks enemies only)   V shadow veil (Sunstep passes)
   G gate (opens when every brazier in the room burns)   b brazier   t tablet

   C crawler  F wisp  T spitter  S Rusted Sentinel  U Umbral Knight
   ===================================================================== */

};
const TABLETS = {
  '0,0': 'You are the last Knight of Dawn, sworn to the buried sun. The Umbral Knight sealed its light beneath the earth. Climb toward the dawn and break the seal.',
  '1,0': 'A veil of living shadow. Darkness this thick yields only to light that moves faster than it can.',
  '2,0': 'The old road ends in a field of thorns. Below, a rusted sentinel still guards the Sunstep.',
  '3,0': 'Past the veil rest the Gilded Wings. With them, no wall is too high to climb.',
  '3,-2': 'Two braziers sleep before the throne. Wake them with thrown light and the Gate of Dusk will open.',
};
const ABIL = {
  dash:  { name: 'Sunstep',       key: 'C or Shift',      color: '#ffd36a', text: 'Blink forward as a streak of light, even in mid-air. Shadow veils cannot stop you.' },
  wings: { name: 'Gilded Wings',  key: 'Jump on a wall',  color: '#ffe9a8', text: 'Slide down walls and leap away from them. Climb what feet alone cannot.' },
  lance: { name: 'Lance of Dawn', key: 'Slash',           color: '#fff3c4', text: 'Every slash now hurls a lance of light. Lances pierce enemies and wake sleeping braziers.' },
};
const SHRINE_CH = { D: 'dash', W: 'wings', L: 'lance' };
const MINI = { '0,0': [0, 0], '1,0': [1, 0], '2,0': [2, 0], '2,1': [2, 1], '3,0': [3, 0], '3,-1': [3, -1], '3,-2': [3, -2], '4,-2': [4, -2] };

/* ===================== INPUT ===================== */
const keys = {}, pressed = {};
const KEYMAP = {ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',
  KeyZ:'jump',Space:'jump',KeyX:'attack',KeyJ:'attack',KeyC:'dash',KeyK:'dash',ShiftLeft:'dash',ShiftRight:'dash',KeyF:'heal',KeyL:'heal',Enter:'start'};
function press(a){ if (!keys[a]) pressed[a] = true; keys[a] = true; initAudio(); }
function release(a){ keys[a] = false; }
function setTouchUI(on){ document.body.classList.toggle('touch', on); }
setTouchUI(matchMedia('(pointer:coarse)').matches || (navigator.maxTouchPoints > 0 && !matchMedia('(hover:hover)').matches));
addEventListener('touchstart', () => setTouchUI(true), { passive: true });
addEventListener('keydown', e => { const a = KEYMAP[e.code]; if (a) { e.preventDefault(); setTouchUI(false); press(a); } });
addEventListener('keyup', e => { const a = KEYMAP[e.code]; if (a) release(a); });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
document.querySelectorAll('#tc button').forEach(b => {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', e => { e.preventDefault(); b.setPointerCapture(e.pointerId); b.classList.add('on'); press(k); });
  const up = () => { b.classList.remove('on'); release(k); };
  b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('lostpointercapture', up);
});
cv.addEventListener('pointerdown', () => { press('start'); setTimeout(() => release('start'), 60); });

/* ===================== AUDIO ===================== */
let AC = null;
function initAudio(){ if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } }
function sfx(f, d = 0.1, type = 'square', v = 0.04, f2){
  if (!AC) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d);
}

/* ===================== STATE ===================== */
const SAVE_KEY = 'lanternfall-save-v2';
const roomState = {};
const st = k => roomState[k] || (roomState[k] = { dead: new Set(), got: new Set(), lit: new Set() });
let flags = { sentinel: false, umbral: false };
const visited = new Set();
let mode = 'title', menuSel = 0, frame = 0, playFrames = 0;
let room, bgCanvas, tileCanvas, particles = [], items = [], lances = [];
let rings = [], hudPop = [], healPulse = 0;
let shake = 0, hitstop = 0, banner = null, msg = null, deadT = 0, fadeIn = 0, endT = 0, flash = 0;
let spawn = null, pickup = null;
const P = { x:0,y:0,w:18,h:28,vx:0,vy:0,face:1,onGround:false,coyote:0,jumpBuf:0,jumping:false,wallLock:0,wallDir:0,
  dashT:0,dashCd:0,canDash:true,atkT:0,atkCd:0,atkDir:'side',hits:null,hp:5,maxHp:5,glow:0,inv:0,healT:0,embers:0,knock:0,sq:0,safeX:0,safeY:0,
  has: { dash:false, wings:false, lance:false } };

function readSave(){ try { return JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) { return null; } }
function writeSave(){
  try {
    const rooms = {};
    for (const k in roomState) rooms[k] = { got: [...roomState[k].got], lit: [...roomState[k].lit] };
    localStorage.setItem(SAVE_KEY, JSON.stringify({ has: P.has, maxHp: P.maxHp, embers: P.embers, flags, visited: [...visited], spawn, rooms, time: playFrames }));
  } catch (e) {}
}

/* ===================== TILES & COLLISION ===================== */
function tileAt(tx, ty){ return (ty >= 0 && ty < H && tx >= 0 && tx < W) ? room.tiles[ty][tx] : null; }
function isSolid(tx, ty, enemy){
  const t = tileAt(tx, ty);
  if (t === null) {
    if (enemy || room.locked) return true;
    if (ty >= 0 && ty < H) return !ROOMS[(room.rx + (tx < 0 ? -1 : 1)) + ',' + room.ry];
    if (tx >= 0 && tx < W) return !ROOMS[room.rx + ',' + (room.ry + (ty < 0 ? -1 : 1))];
    return true;
  }
  if (t === '#') return true;
  if (t === 'G') return !room.gateOpen;
  if (t === 'V') return enemy || P.dashT === 0;
  if (t === '=') return !!enemy;
  return false;
}
function collides(x, y, w, h, enemy){
  const x0 = Math.floor(x / T), x1 = Math.floor((x + w - 0.01) / T), y0 = Math.floor(y / T), y1 = Math.floor((y + h - 0.01) / T);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) if (isSolid(tx, ty, enemy)) return true;
  return false;
}
function move(b, dx, dy, enemy){
  let hx = 0, hy = 0;
  b.x += dx;
  if (dx && collides(b.x, b.y, b.w, b.h, enemy)) { if (dx > 0) b.x = Math.floor((b.x + b.w - 0.01) / T) * T - b.w; else b.x = (Math.floor(b.x / T) + 1) * T; hx = Math.sign(dx); }
  b.y += dy;
  if (dy && collides(b.x, b.y, b.w, b.h, enemy)) { if (dy > 0) b.y = Math.floor((b.y + b.h - 0.01) / T) * T - b.h; else b.y = (Math.floor(b.y / T) + 1) * T; hy = Math.sign(dy); }
  return { hx, hy };
}
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
function tilesIn(b, ch){
  const out = [], x0 = Math.floor(b.x / T), x1 = Math.floor((b.x + b.w - 0.01) / T), y0 = Math.floor(b.y / T), y1 = Math.floor((b.y + b.h - 0.01) / T);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) if (tileAt(tx, ty) === ch) out.push([tx, ty]);
  return out;
}
const touchesSpike = b => tilesIn(b, '^').some(([tx, ty]) => overlap(b, { x: tx * T + 3, y: ty * T + 12, w: T - 6, h: T - 12 }));
const inVeil = b => tilesIn(b, 'V').length > 0;

/* ===================== ROOMS ===================== */
function rng(seed){ let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
function hashStr(s){ let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; }
const ENT = { crawler: [26, 20, 3], flyer: [24, 20, 2], turret: [24, 26, 3], boss: [64, 60, 20], umbral: [36, 62, 40] };
function mkEnt(type, tx, ty, id){
  const s = ENT[type];
  const e = { type, id, w: s[0], h: s[1], hp: s[2], maxHp: s[2], vx: 0, vy: 0, kx: 0, ky: 0, flash: 0, dir: -1, face: -1, seed: Math.random() * 10,
    state: (type === 'boss' || type === 'umbral') ? 'sleep' : 'active', t: 0, cd: 60 + Math.random() * 60, alpha: 1 };
  e.x = tx * T + (T - e.w) / 2; e.y = (ty + 1) * T - e.h;
  return e;
}
function loadRoom(key){
  const def = ROOMS[key], [rx, ry] = key.split(',').map(Number), s = st(key);
  room = { key, rx, ry, def, tiles: def.map.map(r => r.split('')), ents: [], bench: null, start: null, tablets: [], braziers: [], gateOpen: false, locked: false };
  items = []; particles = []; lances = []; rings = [];
  visited.add(key);
  def.map.forEach((row, ty) => [...row].forEach((c, tx) => {
    if ('#^=.VG'.includes(c)) return;
    const id = tx + ',' + ty;
    room.tiles[ty][tx] = '.';
    if (c === 'C' && !s.dead.has(id)) room.ents.push(mkEnt('crawler', tx, ty, id));
    if (c === 'F' && !s.dead.has(id)) room.ents.push(mkEnt('flyer', tx, ty, id));
    if (c === 'T' && !s.dead.has(id)) room.ents.push(mkEnt('turret', tx, ty, id));
    if (c === 'S' && !flags.sentinel) room.ents.push(mkEnt('boss', tx, ty, id));
    if (c === 'U' && !flags.umbral) room.ents.push(mkEnt('umbral', tx, ty, id));
    if (c === 'B') room.bench = { x: tx * T - 8, y: ty * T + 14, w: 48, h: 18 };
    if (c === 'P') room.start = { x: tx * T + 7, y: (ty + 1) * T - P.h };
    if (c === 't') room.tablets.push({ x: tx * T + 4, y: (ty + 1) * T - 32, w: 24, h: 32, text: TABLETS[key] });
    if (c === 'b') room.braziers.push({ id, tx, ty, lit: s.lit.has(id) });
    if (c === 'o' && !s.got.has(id)) items.push({ kind: 'ember', id, x: tx * T + 9, y: ty * T + 9, w: 14, h: 14 });
    if (c === 'H' && !s.got.has(id)) items.push({ kind: 'heart', id, x: tx * T + 6, y: ty * T + 6, w: 20, h: 20 });
    if (SHRINE_CH[c] && !P.has[SHRINE_CH[c]]) items.push({ kind: 'shrine', ab: SHRINE_CH[c], x: tx * T + 2, y: (ty + 1) * T - 44, w: 28, h: 44 });
  }));
  room.gateOpen = room.braziers.length > 0 && room.braziers.every(b => b.lit);
  buildCanvases();
  banner = { text: def.name, t: 150 };
}

let farCanvas, midCanvas, foreCanvas, fogCanvas;
const PAD = 90;
function buildCanvases(){
  const hue = room.def.hue, r = rng(hashStr(room.key)), BW = VW + PAD * 2;
  room.flora = []; room.rays = [];
  let b;
  // ---- far layer: sky of the cavern, distant ruins
  [farCanvas, b] = mkCanvas(BW, VH);
  let g = b.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, `hsl(${hue},40%,15%)`); g.addColorStop(0.55, `hsl(${hue},34%,8%)`); g.addColorStop(1, `hsl(${hue},30%,4%)`);
  b.fillStyle = g; b.fillRect(0, 0, BW, VH);
  for (let i = 0; i < 2; i++) {
    const gx = r() * BW, gy = VH * (0.15 + r() * 0.35), rad = 260 + r() * 200;
    const rg = b.createRadialGradient(gx, gy, 0, gx, gy, rad);
    rg.addColorStop(0, `hsla(${hue + 35},65%,45%,.22)`); rg.addColorStop(1, `hsla(${hue + 35},65%,45%,0)`);
    b.fillStyle = rg; b.fillRect(0, 0, BW, VH);
  }
  b.fillStyle = `hsla(${hue},30%,13%,.85)`;
  for (let i = 0; i < 7; i++) {
    const x = r() * BW, w = 16 + r() * 18, top = VH * (0.22 + r() * 0.4);
    b.fillRect(x, top, w, VH - top); b.fillRect(x - 6, top, w + 12, 7);
    if (r() < 0.5) b.fillRect(x - 3, top + 16, w + 6, 3);
    if (r() < 0.4) { b.fillRect(x - 2, top - 30, w * 0.5, 30); }       // broken column stub
  }
  b.strokeStyle = `hsla(${hue},30%,13%,.85)`; b.lineWidth = 13;
  for (let i = 0; i < 3; i++) { const x = r() * BW, rad = 70 + r() * 110, y = VH * (0.5 + r() * 0.3); b.beginPath(); b.arc(x, y, rad, Math.PI, 0); b.stroke(); }
  b.strokeStyle = `hsla(${hue},20%,18%,.6)`; b.lineWidth = 2; b.setLineDash([4, 3]);
  for (let i = 0; i < 5; i++) { const x = r() * BW, len = 50 + r() * 190; b.beginPath(); b.moveTo(x, 0); b.lineTo(x, len); b.stroke(); }
  b.setLineDash([]);
  // ---- mid layer: stalactites with a cold rim light
  [midCanvas, b] = mkCanvas(BW, VH);
  for (let i = 0; i < 16; i++) {
    const x = r() * BW, w = 40 + r() * 90, h = 70 + r() * 210;

  for (let i = 0; i < 3; i++) room.rays.push({ x: r() * VW - 60, w: 36 + r() * 70, ph: r() * 6 });

  for (let ty = 0; ty < H; ty++) for (let tx = 0; tx < W; tx++) {

      tg.addColorStop(0, `hsl(${hue},17%,${9 + r() * 2}%)`); tg.addColorStop(1, `hsl(${hue},17%,${6 + r() * 2}%)`);
      c.fillStyle = tg; c.fillRect(x, y, T, T);
      for (let i = 0; i < 5; i++) { c.fillStyle = r() < 0.5 ? `hsla(${hue},25%,20%,.35)` : `hsla(${hue},25%,2%,.5)`; c.fillRect(x + r() * 28, y + r() * 28, 2 + r() * 5, 1 + r() * 3); }
      if (r() < 0.15) { c.strokeStyle = `hsla(${hue},20%,2%,.6)`; c.lineWidth = 1; c.beginPath(); c.moveTo(x + r() * T, y + r() * T); c.lineTo(x + r() * T, y + r() * T); c.stroke(); }
      const open = [!solid(tx, ty - 1), !solid(tx + 1, ty), !solid(tx, ty + 1), !solid(tx - 1, ty)];
      if (open[3]) { const sg = c.createLinearGradient(x, 0, x + 8, 0); sg.addColorStop(0, `hsla(${hue + 15},30%,30%,.55)`); sg.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = sg; c.fillRect(x, y, 8, T); }

        c.fillStyle = `hsl(${hue + 25},35%,42%)`; c.fillRect(x, y, T, 2);

        c.fillStyle = sg; c.beginPath(); c.moveTo(bx, y + T); c.quadraticCurveTo(bx + 2, y + T - th * 0.5, bx + 4 + lean, y + T - th); c.quadraticCurveTo(bx + 6, y + T - th * 0.5, bx + 8, y + T); c.fill();

/* ===================== PARTICLES ===================== */
function burst(x, y, n, color, spd = 4, life = 30, grav = 0.15, size = 3){
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = Math.random() * spd;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: life * (0.5 + Math.random() * 0.5), max: life, color, grav, size });
  }
}
function dropEmbers(x, y, n){ for (let i = 0; i < n; i++) items.push({ kind: 'drop', x, y, w: 8, h: 8, vx: (Math.random() - 0.5) * 6, vy: -3 - Math.random() * 4, age: 0 }); }

/* ===================== GAME FLOW ===================== */
function resetWorld(){
  for (const k in roomState) delete roomState[k];
  visited.clear(); flags = { sentinel: false, umbral: false }; playFrames = 0; endT = 0; flash = 0;
  Object.assign(P, { hp: 5, maxHp: 5, glow: 0, embers: 0, has: { dash: false, wings: false, lance: false } });
}
function newGame(){
  resetWorld();
  loadRoom('0,0');
  spawn = { key: '0,0', x: room.start.x, y: room.start.y };
  placeAtSpawn();
  msg = { text: document.body.classList.contains('touch')
    ? 'Hold ▲ or ▼ while slashing to aim. Hold Heal to turn 3 light into health. Press ▲ to read stones and rest at benches.'
    : 'Arrows / WASD move · Z jump · X slash (aim with ↑ / ↓) · hold F to heal · ↑ to read stones and rest at benches', t: 480 };
}
function continueGame(s){
  resetWorld();
  P.has = Object.assign({ dash: false, wings: false, lance: false }, s.has);
  P.maxHp = s.maxHp || 5; P.embers = s.embers || 0; flags = Object.assign({ sentinel: false, umbral: false }, s.flags);
  (s.visited || []).forEach(k => visited.add(k));
  for (const k in s.rooms || {}) { const r = st(k); s.rooms[k].got.forEach(i => r.got.add(i)); s.rooms[k].lit.forEach(i => r.lit.add(i)); }
  playFrames = s.time || 0;
  spawn = s.spawn && ROOMS[s.spawn.key] ? s.spawn : { key: '0,0', x: 71, y: 452 };
  loadRoom(spawn.key); placeAtSpawn();
}
function placeAtSpawn(){
  Object.assign(P, { x: spawn.x, y: spawn.y, vx: 0, vy: 0, hp: P.maxHp, glow: 0, inv: 0, knock: 0, dashT: 0, atkT: 0, healT: 0, canDash: true });
  P.safeX = P.x; P.safeY = P.y; mode = 'play'; fadeIn = 1;
}
function respawnAll(){ for (const k in roomState) roomState[k].dead.clear(); }
function respawn(){ respawnAll(); loadRoom(spawn.key); placeAtSpawn(); P.inv = 60; }

function hurt(fromX){
  if (P.inv > 0 || mode !== 'play' || endT) return false;
  P.hp--; P.inv = 75; P.vy = -7; P.knock = (P.x + P.w / 2 < fromX ? -7 : 7); P.dashT = 0; P.healT = 0;
  shake = 12; hitstop = 8; sfx(160, 0.3, 'sawtooth', 0.06, 50);
  burst(P.x + P.w / 2, P.y + P.h / 2, 14, '#fff6dc', 5, 30);
  if (P.hp <= 0) { mode = 'dead'; deadT = 120; burst(P.x + P.w / 2, P.y + P.h / 2, 50, '#ffd36a', 6, 70); sfx(300, 1, 'sine', 0.06, 60); }
  return true;
}
function goRoom(dx, dy){
  const k = (room.rx + dx) + ',' + (room.ry + dy);
  if (!ROOMS[k]) return;
  loadRoom(k);
  if (dx === 1) P.x = 2;
  if (dx === -1) P.x = W * T - P.w - 2;
  if (dy === -1) { P.y = H * T - P.h - 2; P.vy = -13.5; }
  if (dy === 1) P.y = 2;
  P.safeX = P.x; P.safeY = P.y; P.canDash = true;
}

/* ===================== PLAYER ===================== */
function attackBox(){
  if (P.atkDir === 'up') return { x: P.x - 12, y: P.y - 44, w: 42, h: 46 };
  if (P.atkDir === 'down') return { x: P.x - 12, y: P.y + P.h - 2, w: 42, h: 44 };
  return P.face > 0 ? { x: P.x + P.w - 2, y: P.y - 6, w: 46, h: 38 } : { x: P.x - 44, y: P.y - 6, w: 46, h: 38 };
}
function nearBench(){ return room.bench && overlap(P, { x: room.bench.x - 6, y: room.bench.y - 30, w: room.bench.w + 12, h: 50 }); }
function nearTablet(){ return room.tablets.find(t => overlap(P, { x: t.x - 14, y: t.y - 10, w: t.w + 28, h: t.h + 10 })); }

function updatePlayer(){
  P.sq *= 0.78;
  const inX = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  let wallDir = 0;
  if (P.has.wings && !P.onGround) wallDir = collides(P.x + 1, P.y + 2, P.w, P.h - 4) ? 1 : collides(P.x - 1, P.y + 2, P.w, P.h - 4) ? -1 : 0;
  P.wallDir = wallDir;

  if (P.inv > 0) P.inv--;
  if (P.dashCd > 0) P.dashCd--;
  if (P.atkCd > 0) P.atkCd--;
  if (P.wallLock > 0) P.wallLock--;
  if (P.coyote > 0) P.coyote--;
  if (P.jumpBuf > 0) P.jumpBuf--;
  if (pressed.jump) P.jumpBuf = 8;

  // focus light to heal
  const canHeal = keys.heal && P.onGround && P.glow >= 3 && P.hp < P.maxHp && P.atkT === 0 && P.dashT === 0;
  if (canHeal) {
    P.healT++;
    const hx = P.x + P.w / 2, hy = P.y + P.h / 2;
    if (P.healT % 2 === 0) {
      const a = Math.random() * Math.PI * 2, rr = 64 + Math.random() * 34;
      particles.push({ x: hx + Math.cos(a) * rr, y: hy + Math.sin(a) * rr * 0.8, vx: -Math.sin(a) * 2.2, vy: Math.cos(a) * 2.2, life: 50, max: 50, color: Math.random() < 0.3 ? '#ffffff' : '#ffe39a', grav: 0, size: 2 + Math.random() * 2.5, seek: true });
    }
    if (P.healT % 8 === 0) sfx(180 + P.healT * 8, 0.16, 'sine', 0.018);
    if (P.healT >= 50) {
      P.hp++; P.glow -= 3; P.healT = 0; hudPop[P.hp - 1] = 1; healPulse = 1; flash = Math.max(flash, 0.16);
      rings.push({ x: hx, y: hy, r: 8, max: 130, life: 1, color: '255,236,180', w: 4 });
      rings.push({ x: hx, y: hy, r: 4, max: 70, life: 1, color: '255,255,255', w: 2 });
      for (let i = 0; i < 30; i++) particles.push({ x: hx + (Math.random() - 0.5) * 24, y: hy + 8, vx: (Math.random() - 0.5) * 2.5, vy: -1.5 - Math.random() * 5, life: 50, max: 50, color: Math.random() < 0.4 ? '#ffffff' : '#ffd36a', grav: -0.02, size: 2 + Math.random() * 3 });
      sfx(523, 0.7, 'sine', 0.05); sfx(659, 0.7, 'sine', 0.04); sfx(784, 0.9, 'sine', 0.035); sfx(1046, 0.9, 'triangle', 0.015);
    }
  } else P.healT = 0;

  if (P.healT === 0 && inX && P.wallLock === 0 && P.dashT === 0) P.face = inX;

  // Sunstep
  if (pressed.dash && P.has.dash && P.dashCd === 0 && P.canDash && P.healT === 0) {
    P.dashT = 12; P.dashCd = 26; if (!P.onGround) P.canDash = false;
    if (wallDir) P.face = -wallDir; else if (inX) P.face = inX;
    sfx(620, 0.18, 'triangle', 0.04, 1400);
  }
  // slash (+ lance of light)
  if (pressed.attack && P.atkCd === 0 && P.healT === 0) {
    P.atkT = 12; P.atkCd = 20; P.hits = new Set();
    P.atkDir = keys.up ? 'up' : (keys.down && !P.onGround ? 'down' : 'side');
    sfx(900, 0.08, 'square', 0.025, 300);
    if (P.has.lance) {
      const cx = P.x + P.w / 2, cy = P.y + P.h / 2;
      const d = P.atkDir === 'up' ? [0, -1] : P.atkDir === 'down' ? [0, 1] : [P.face, 0];
      const horiz = d[0] !== 0;
      lances.push({ x: cx - (horiz ? 15 : 5), y: cy - (horiz ? 5 : 15), w: horiz ? 30 : 10, h: horiz ? 10 : 30, vx: d[0] * 12, vy: d[1] * 12, life: 34, hit: new Set() });
      sfx(1500, 0.12, 'sine', 0.03, 2400);
    }
  }

  let dx, dy, dashing = false;
  if (P.dashT > 0) {
    dashing = true; P.vy = 0; dx = P.face * 10.5; dy = 0;
    particles.push({ x: P.x + P.w / 2, y: P.y + P.h / 2, vx: 0, vy: 0, life: 16, max: 16, color: '#ffd36a', grav: 0, size: 10 });
  } else {
    const target = P.healT ? 0 : inX * 4.2;
    P.vx = P.wallLock > 0 ? P.vx + (target - P.vx) * 0.12 : target;
    P.vy = Math.min(P.vy + 0.6, 14);
    if (wallDir && P.vy > 0 && inX === wallDir) {
      P.vy = Math.min(P.vy, 2.2);
      if (frame % 5 === 0) particles.push({ x: P.x + (wallDir > 0 ? P.w : 0), y: P.y + P.h - 4, vx: -wallDir, vy: -0.5, life: 16, max: 16, color: '#ffe9a8', grav: 0, size: 2 });
    }
    if (P.jumpBuf > 0 && P.healT === 0) {
      if (P.coyote > 0) {
        P.vy = -12.2; P.jumping = true; P.coyote = 0; P.jumpBuf = 0; P.sq = -0.2; sfx(380, 0.12, 'triangle', 0.04, 620);
      } else if (wallDir) {
        P.vy = -11.5; P.vx = -wallDir * 6.5; P.wallLock = 10; P.sq = -0.18; P.face = -wallDir; P.jumping = true; P.jumpBuf = 0; P.canDash = true;
        sfx(460, 0.12, 'triangle', 0.04, 760);
        burst(P.x + (wallDir > 0 ? P.w : 0), P.y + P.h / 2, 8, '#ffe9a8', 2.5, 20);
      }
    }
    if (!keys.jump && P.jumping && P.vy < -3) { P.vy = -3; P.jumping = false; }
    if (P.vy >= 0) P.jumping = false;
    dx = P.vx + P.knock; dy = P.vy;
  }
  P.knock *= 0.82; if (Math.abs(P.knock) < 0.1) P.knock = 0;

  const wasGround = P.onGround;
  const r = move(P, dx, dy, false);
  if (dashing) {
    if (r.hx) P.dashT = 0;
    else if (!(P.dashT === 1 && inVeil(P))) P.dashT--;      // never end a Sunstep inside a veil
    if (inVeil(P) && frame % 2 === 0) burst(P.x + P.w / 2, P.y + P.h / 2, 3, '#b48cff', 3, 20, 0);
  }
  if (r.hy > 0) { P.vy = 0; P.onGround = true; P.canDash = true; if (!wasGround) { P.sq = clamp(dy * 0.022, 0.04, 0.26); burst(P.x + P.w / 2, P.y + P.h, 3 + Math.floor(dy / 3), '#8a8aa0', 1.5, 14); } }
  else { P.onGround = false; if (r.hy < 0) P.vy = 0; }
  if (P.onGround) P.coyote = 6;

  if (P.onGround && P.inv === 0) {
    const fy = Math.floor((P.y + P.h + 2) / T);
    if (tileAt(Math.floor(P.x / T), fy) === '#' && tileAt(Math.floor((P.x + P.w) / T), fy) === '#') { P.safeX = P.x; P.safeY = P.y; }
  }

  // slash hits
  if (P.atkT > 0) {
    P.atkT--;
    if (P.atkT >= 6) {
      const ab = attackBox();
      for (const e of room.ents) {
        if (e.dead || P.hits.has(e) || !overlap(ab, e)) continue;
        if (e.type === 'orb') { e.dead = true; burst(e.x + 6, e.y + 6, 8, '#b48cff', 3, 16); continue; }
        if (HAZ.has(e.type)) continue;
        P.hits.add(e);
        damage(e, 1, P.atkDir === 'side' ? P.face : 0, P.atkDir === 'up' ? -1 : P.atkDir === 'down' ? 1 : 0, true);
        if (P.atkDir === 'side') P.knock = -P.face * 4.5;
        if (P.atkDir === 'down') pogo();
      }
      if (P.atkDir === 'down' && !P.hits.has('spike') && touchesSpike(ab)) { P.hits.add('spike'); pogo(); sfx(1200, 0.05, 'square', 0.02); }
    }
  }

  // thorns
  if (touchesSpike(P) && mode === 'play') {
    P.inv = 0;
    if (hurt(P.x + P.w / 2) && mode === 'play') { P.x = P.safeX; P.y = P.safeY; P.vx = P.vy = P.knock = 0; P.dashT = 0; fadeIn = 0.8; }
  }

  // interact
  if (pressed.up && P.onGround) {
    const tab = nearTablet();
    if (tab) { msg = { text: tab.text, t: 480 }; sfx(520, 0.2, 'sine', 0.03, 660); }
    else if (nearBench()) {

/* ===================== LANCES ===================== */

/* ===================== ENEMIES ===================== */
const HAZ = new Set(['wave', 'orb', 'fall', 'hz']);

}
function killEnemy(e){

  const cx = e.x + e.w / 2, cy = e.y + e.h / 2;
  burst(cx, cy, e.type === 'umbral' ? 120 : e.type === 'boss' ? 80 : 20, e.type === 'boss' ? '#ff9a4a' : '#b48cff', e.type === 'umbral' ? 10 : 6, 60);

    msg = { text: 'The shrine behind the Sentinel is awake.', t: 220 };
    writeSave();
  } else if (e.type === 'umbral') {
    flags.umbral = true; hitstop = 30; endT = 200;

function wakeBoss(e){ e.state = 'roar'; e.t = 70; shake = 22; banner = { text: 'The Rusted Sentinel', t: 170 }; sfx(70, 0.8, 'sawtooth', 0.08, 35); }
function shockwaves(e, speed, color){

}
function umbralChoose(e, enr, sp, dist){
  if (enr && !e.p2) {
    e.p2 = true; e.state = 'intro'; e.t = 70; shake = 24; flash = 0.5;
    banner = { text: 'The shadow deepens', t: 140 }; sfx(50, 1, 'sawtooth', 0.08, 25);
    return;

  const pick = pool[Math.floor(Math.random() * pool.length)];

function endDash(e, enr){

function updateEnts(){
  const pcx = P.x + P.w / 2, pcy = P.y + P.h / 2;
  room.locked = room.ents.some(e => (e.type === 'boss' || e.type === 'umbral') && e.state !== 'sleep');
  for (const e of room.ents) {
    if (e.dead) continue;
    if (e.flash > 0) e.flash--;
    const ecx = e.x + e.w / 2, ecy = e.y + e.h / 2;
    if (e.type === 'crawler') {
      e.vy = Math.min(e.vy + 0.6, 12); e.kx *= 0.8;
      const r = move(e, e.dir * 1.1 + e.kx, e.vy, true);
      if (r.hy) e.vy = 0;

/* ===================== ITEMS ===================== */
function updateItems(){

  for (const it of items) {
    if (it.kind === 'drop') {
      it.age++;
      const dx = P.x + P.w / 2 - it.x, dy = P.y + P.h / 2 - it.y, d = Math.hypot(dx, dy) || 1;
      if (it.age > 25 && d < 90) { it.x += dx / d * 6; it.y += dy / d * 6; }
      else { it.vy = Math.min(it.vy + 0.4, 9); it.vx *= 0.97; const r = move(it, it.vx, it.vy, true); if (r.hy > 0) { it.vy *= -0.4; it.vx *= 0.7; } if (r.hx) it.vx *= -0.6; }
      if (it.age > 15 && overlap(P, it)) { it.gone = true; P.embers++; sfx(1300 + Math.random() * 300, 0.06, 'sine', 0.03); }
      continue;
    }
    if (mode !== 'play' || !overlap(P, it)) continue;
    if (it.kind === 'ember') { it.gone = true; st(room.key).got.add(it.id); P.embers += 5; sfx(1100, 0.2, 'sine', 0.04, 1600); burst(it.x + 7, it.y + 7, 14, '#ffb347', 3, 30); }
    if (it.kind === 'heart') {

      burst(it.x + 10, it.y + 10, 30, '#ff9a6a', 4, 50); msg = { text: 'Heart Vessel found. Your maximum health rises by one.', t: 240 }; writeSave();
    }

      burst(it.x + 14, it.y + 10, 60, ABIL[it.ab].color, 6, 60, -0.02);

/* ===================== STEP ===================== */
function step(){
  frame++;
  if (mode === 'title') {
    const opts = titleOptions();
    if (pressed.up) menuSel = (menuSel + opts.length - 1) % opts.length;
    if (pressed.down) menuSel = (menuSel + 1) % opts.length;
    menuSel = Math.min(menuSel, opts.length - 1);
    if (pressed.start || pressed.jump || pressed.attack) {
      const o = opts[menuSel];
      if (o === 'Continue') continueGame(readSave()); else newGame();
    }
  } else if (mode === 'win') {
    if (pressed.start || pressed.jump) { mode = 'title'; menuSel = 0; }
  } else if (mode === 'pickup') {
    pickup.t++;
    if (pickup.t > 50 && (pressed.start || pressed.jump || pressed.attack)) { mode = 'play'; flash = 0.4; }
  } else if (hitstop > 0) hitstop--;
  else {
    if (mode === 'play') {
      playFrames++; updatePlayer();
      if (endT > 0) { endT--; flash = Math.max(flash, 1 - endT / 200); if (endT === 0) mode = 'win'; }
    }
    if (mode === 'dead' && --deadT <= 0) respawn();
    if (mode === 'play' || mode === 'dead') { updateLances(); updateEnts(); updateItems(); }
  }
  for (const p of particles) {
    if (p.seek) {
      const dx = P.x + P.w / 2 - p.x, dy = P.y + P.h / 2 - 2 - p.y, d = Math.hypot(dx, dy) || 1;
      p.vx = p.vx * 0.9 + dx / d * 0.7; p.vy = p.vy * 0.9 + dy / d * 0.7;
      if (d < 8) p.life = 0; else if (P.healT === 0 && p.life > 10) p.life = 10;
    }
    p.x += p.vx; p.y += p.vy; p.vy += p.grav; p.vx *= 0.96; p.life--;
  }
  for (const rg of rings) { rg.r += (rg.max - rg.r) * 0.12; rg.life -= 0.03; }
  rings = rings.filter(rg => rg.life > 0);
  hudPop = hudPop.map(v => Math.max(0, (v || 0) - 0.035));
  healPulse = Math.max(0, healPulse - 0.025);
  particles = particles.filter(p => p.life > 0);
  if (shake > 0) shake *= 0.85; if (shake < 0.3) shake = 0;
  if (banner && --banner.t <= 0) banner = null;
  if (msg && mode === 'play' && --msg.t <= 0) msg = null;
  if (fadeIn > 0) fadeIn = Math.max(0, fadeIn - 0.04);
  if (flash > 0 && !endT) flash = Math.max(0, flash - 0.03);
  for (const k in pressed) delete pressed[k];
}
function titleOptions(){ const s = readSave(); return s ? ['Continue', 'New game'] : ['Begin']; }

/* ===================== DRAW HELPERS ===================== */

/* ===================== DRAW: HERO ===================== */
function drawHealFX(){

  for (const it of items) {
    if (it.kind === 'ember') L.push([it.x + 7, it.y + 7, 70, 0.8, '255,170,60', 0.15]);
    else if (it.kind === 'drop') L.push([it.x + 4, it.y + 4, 34, 0.6]);
    else if (it.kind === 'heart') L.push([it.x + 10, it.y + 10, 100, 0.9, '255,120,90', 0.18]);
    else if (it.kind === 'shrine' && !room.ents.some(e => e.type === 'boss')) L.push([it.x + 14, it.y + 12, 170, 1, '255,220,140', 0.2]);
  }
  for (const l of lances) L.push([l.x + l.w / 2, l.y + l.h / 2, 130, 1, '255,220,140', 0.2]);
  for (const f of room.flora) L.push([f.x, f.y, 40, 0.55]);
  for (const e of room.ents) {
    if (e.type === 'orb') L.push([e.x + 6, e.y + 6, 60, 0.5, '170,110,255', 0.2]);
    else if (e.type === 'umbral' && e.state !== 'sleep') L.push([e.x + e.w / 2, e.y + 10, 90, 0.5, '140,90,255', 0.12]);
    else if (e.type === 'wave') L.push([e.x + 9, e.y + 12, 60, 0.6]);
  }
  for (const rg of rings) L.push([rg.x, rg.y, rg.r * 1.4, rg.life * 0.8]);
  return L;
}
function drawLighting(lights, sx, sy){
  lctx.setTransform(DPR, 0, 0, DPR, sx * DPR, sy * DPR);
  lctx.globalCompositeOperation = 'source-over';
  lctx.clearRect(-60, -60, VW + 120, VH + 120);
  lctx.fillStyle = 'rgba(3,3,12,.6)'; lctx.fillRect(-60, -60, VW + 120, VH + 120);
  lctx.globalCompositeOperation = 'destination-out';
  for (const [x, y, r, a] of lights) {
    const g = lctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(0,0,0,${a})`); g.addColorStop(0.45, `rgba(0,0,0,${a * 0.7})`); g.addColorStop(1, 'rgba(0,0,0,0)');
    lctx.fillStyle = g; lctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
  ctx.save(); ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.drawImage(lightC, 0, 0, VW, VH); ctx.restore();
  // warm bloom on top of the darkness
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const [x, y, r, , col, s] of lights) if (col) glow(x, y, r * 0.6, `rgba(${col},A)`, s);
  for (const f of room.flora) glow(f.x, f.y, 14, 'rgba(255,240,200,A)', 0.35);
  ctx.restore();
}
function drawRays(){
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const ray of room.rays) {
    const a = 0.05 + Math.sin(frame * 0.012 + ray.ph) * 0.025;
    const g = ctx.createLinearGradient(0, 0, 0, VH * 0.9);
    g.addColorStop(0, `hsla(${room.def.hue + 40},70%,80%,${a})`); g.addColorStop(1, `hsla(${room.def.hue + 40},70%,80%,0)`);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(ray.x, 0); ctx.lineTo(ray.x + ray.w, 0); ctx.lineTo(ray.x + ray.w * 2.2 + 160, VH); ctx.lineTo(ray.x + 160, VH); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}
function drawFog(speed, alpha, y){
  const off = (frame * speed) % VW;
  ctx.globalAlpha = alpha; ctx.drawImage(fogCanvas, -off, y, VW * 2, 220); ctx.globalAlpha = 1;
}

/* ===================== DRAW: HUD ===================== */
function drawAbilityIcon(ab, x, y, have){
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = have ? 'rgba(255,214,110,.18)' : 'rgba(255,255,255,.04)'; circle(0, 0, 11);
  ctx.strokeStyle = have ? '#ffd36a' : 'rgba(255,255,255,.15)'; ctx.fillStyle = ctx.strokeStyle; ctx.lineWidth = 2;
  if (ab === 'dash') { for (let i = 0; i < 2; i++) { ctx.beginPath(); ctx.moveTo(-5 + i * 5, -5); ctx.lineTo(0 + i * 5, 0); ctx.lineTo(-5 + i * 5, 5); ctx.stroke(); } }
  if (ab === 'wings') { ctx.beginPath(); ctx.ellipse(-3, -1, 6, 3, -0.6, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.ellipse(3, -1, 6, 3, 0.6, 0, Math.PI * 2); ctx.fill(); }
  if (ab === 'lance') { ctx.beginPath(); ctx.moveTo(7, -7); ctx.lineTo(-6, 6); ctx.stroke(); ctx.beginPath(); ctx.moveTo(7, -7); ctx.lineTo(1, -6); ctx.lineTo(6, -1); ctx.fill(); }
  ctx.restore();
}
function drawMinimap(){
  const ox = VW - 150, oy = 18, cw = 22, ch = 13;
  ctx.fillStyle = 'rgba(4,4,12,.45)'; ctx.fillRect(ox - 8, oy - 6, 5 * (cw + 4) + 12, 4 * (ch + 4) + 10);
  for (const k in MINI) {
    if (!visited.has(k)) continue;
    const [mx, my] = MINI[k], x = ox + mx * (cw + 4), y = oy + (my + 2) * (ch + 4);
    ctx.fillStyle = k === room.key ? '#ffd36a' : 'rgba(241,230,200,.35)'; ctx.fillRect(x, y, cw, ch);
    if (ROOMS[k].map.some(r => r.includes('B'))) { ctx.fillStyle = k === room.key ? '#3a2a10' : '#ffd36a'; ctx.fillRect(x + cw / 2 - 2, y + ch / 2 - 2, 4, 4); }
  }
}
function drawVessel(){
  const x = 44, y = 44, R = 22, lvl = P.glow / 9;
  ctx.fillStyle = 'rgba(6,6,14,.7)'; circle(x, y, R + 5);
  ctx.save(); ctx.beginPath(); ctx.arc(x, y, R - 1, 0, Math.PI * 2); ctx.clip();
  const top = y + R - 2 * R * lvl;
  if (lvl > 0) {
    const g = ctx.createLinearGradient(0, y - R, 0, y + R); g.addColorStop(0, '#fff3c4'); g.addColorStop(1, '#e08a24');
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(x - R, y + R);
    for (let xx = x - R; xx <= x + R; xx += 2) ctx.lineTo(xx, top + Math.sin(xx * 0.3 + frame * 0.09) * 1.6);
    ctx.lineTo(x + R, y + R); ctx.fill();
    if (P.healT > 0) {
      const drainTop = y + R - 2 * R * ((P.glow - 3 * P.healT / 50) / 9);
      ctx.fillStyle = `rgba(30,14,0,${0.45 + Math.sin(frame * 0.4) * 0.1})`; ctx.fillRect(x - R, top - 3, 2 * R, drainTop - top + 3);
    }
  }
  ctx.fillStyle = 'rgba(255,255,255,.14)'; ctx.beginPath(); ctx.ellipse(x - 7, y - 9, 7, 4, -0.6, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  if (P.glow >= 3) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; glow(x, y, 40, 'rgba(255,200,100,A)', 0.18 + Math.sin(frame * 0.08) * 0.06); ctx.restore(); }
  ctx.strokeStyle = '#efe0bc'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(x, y, R + 1, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,214,110,.45)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(x, y, R + 5, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = '#efe0bc';
  for (let i = 0; i < 4; i++) { const a = i * Math.PI / 2 - Math.PI / 4, px = x + Math.cos(a) * (R + 5), py = y + Math.sin(a) * (R + 5); ctx.beginPath(); ctx.moveTo(px, py - 3); ctx.lineTo(px + 3, py); ctx.lineTo(px, py + 3); ctx.lineTo(px - 3, py); ctx.fill(); }
}
function drawHUD(){
  drawVessel();
  for (let i = 0; i < P.maxHp; i++) {
    const pop = hudPop[i] || 0, x = 88 + i * 26, y = 46;
    if (i < P.hp) {
      const fl = 0.9 + Math.sin(frame * 0.2 + i * 1.7) * 0.04 + pop * 0.6;
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; glow(x, y - 8, 16 + pop * 20, 'rgba(255,170,70,A)', 0.25 + pop * 0.5); ctx.restore();
      drawFlame(x, y, fl, '#ffb347', '#fff0c0');
    } else drawFlame(x, y, 0.9, 'rgba(255,255,255,.1)', 'rgba(0,0,0,.3)');
  }
  ctx.fillStyle = '#ffb347'; circle(94, 70, 5);
  ctx.fillStyle = '#f6ecd2'; ctx.font = '16px Georgia'; ctx.textAlign = 'left'; ctx.fillText(P.embers, 106, 76);
  ['dash', 'wings', 'lance'].forEach((ab, i) => drawAbilityIcon(ab, 30 + i * 28, 100, P.has[ab]));
  drawMinimap();
  const boss = room.ents.find(e => (e.type === 'boss' || e.type === 'umbral') && e.state !== 'sleep');
  if (boss) {
    const name = boss.type === 'boss' ? 'The Rusted Sentinel' : 'The Umbral Knight';
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(280, VH - 34, 400, 12);
    const bgr = ctx.createLinearGradient(282, 0, 678, 0);
    if (boss.type === 'boss') { bgr.addColorStop(0, '#802a18'); bgr.addColorStop(1, '#e05a30'); } else { bgr.addColorStop(0, '#4a2a90'); bgr.addColorStop(1, '#b080ff'); }
    ctx.fillStyle = bgr; ctx.fillRect(282, VH - 32, 396 * Math.max(0, boss.hp) / boss.maxHp, 8);
    ctx.fillStyle = '#efe2f5'; ctx.font = 'italic 15px Georgia'; ctx.textAlign = 'center'; ctx.fillText(name, VW / 2, VH - 42);
  }
  if (banner) {
    ctx.globalAlpha = Math.max(0, Math.min(1, banner.t / 30, (190 - banner.t) / 30)); ctx.fillStyle = '#fbefd0'; ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(255,200,110,.6)'; ctx.shadowBlur = 18;
    ctx.font = 'italic 36px Georgia'; ctx.fillText(banner.text, VW / 2, 130); ctx.shadowBlur = 0;
    const lg = ctx.createLinearGradient(VW / 2 - 120, 0, VW / 2 + 120, 0); lg.addColorStop(0, 'rgba(255,214,110,0)'); lg.addColorStop(0.5, 'rgba(255,214,110,.9)'); lg.addColorStop(1, 'rgba(255,214,110,0)');
    ctx.fillStyle = lg; ctx.fillRect(VW / 2 - 120, 146, 240, 1.5); ctx.globalAlpha = 1;
  }
  if (msg) {
    ctx.globalAlpha = Math.min(1, msg.t / 30); ctx.font = '16px Georgia'; ctx.textAlign = 'center';
    const lines = wrap(msg.text, 620), h = lines.length * 22 + 18;
    ctx.fillStyle = 'rgba(6,6,14,.78)'; ctx.fillRect(VW / 2 - 330, 166, 660, h);
    ctx.strokeStyle = 'rgba(255,214,110,.35)'; ctx.lineWidth = 1; ctx.strokeRect(VW / 2 - 330 + 0.5, 166.5, 659, h - 1);
    ctx.fillStyle = '#fbefd0'; lines.forEach((l, i) => ctx.fillText(l, VW / 2, 189 + i * 22)); ctx.globalAlpha = 1;
  }
  if (mode === 'play' && P.onGround) {
    const tab = nearTablet(), label = tab ? '▲ Read' : nearBench() ? '▲ Rest' : null;
    if (label) { const ax = tab ? tab.x + 12 : room.bench.x + 24, ay = tab ? tab.y - 14 : room.bench.y - 40;
      ctx.fillStyle = '#fbefd0'; ctx.font = '13px Georgia'; ctx.textAlign = 'center'; ctx.fillText(label, ax, ay); }
  }
}
function drawPickup(){
  const a = Math.min(1, pickup.t / 30), ab = ABIL[pickup.ab];
  ctx.fillStyle = `rgba(4,4,10,${0.84 * a})`; ctx.fillRect(0, 0, VW, VH);
  ctx.globalAlpha = a;
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; glow(VW / 2, 220, 240, 'rgba(255,200,100,A)', 0.4); ctx.restore();
  ctx.save(); ctx.translate(VW / 2, 220); ctx.rotate(frame * 0.01);
  ctx.strokeStyle = 'rgba(255,230,160,.5)'; ctx.lineWidth = 2;
  for (let i = 0; i < 12; i++) { ctx.rotate(Math.PI / 6); ctx.beginPath(); ctx.moveTo(40, 0); ctx.lineTo(90 + (i % 2) * 30, 0); ctx.stroke(); }
  ctx.restore();
  drawAbilityIcon(pickup.ab, VW / 2, 220, true);
  ctx.textAlign = 'center'; ctx.fillStyle = '#ffd36a'; ctx.font = '15px Georgia'; ctx.fillText('A NEW POWER AWAKENS', VW / 2, 330);
  ctx.fillStyle = '#fff8e8'; ctx.shadowColor = 'rgba(255,200,110,.7)'; ctx.shadowBlur = 20;
  ctx.font = 'italic 46px Georgia'; ctx.fillText(ab.name, VW / 2, 382); ctx.shadowBlur = 0;
  ctx.fillStyle = '#e8dcc0'; ctx.font = '18px Georgia';
  wrap(ab.text, 560).forEach((l, i) => ctx.fillText(l, VW / 2, 420 + i * 24));
  ctx.fillStyle = '#ffd36a'; ctx.font = '15px Georgia'; ctx.fillText('Control: ' + ab.key, VW / 2, 480);
  if (pickup.t > 50) { ctx.globalAlpha = 0.5 + Math.sin(frame * 0.1) * 0.4; ctx.fillStyle = '#c8bca0'; ctx.fillText('Press jump or slash to continue', VW / 2, 514); }
  ctx.globalAlpha = 1;
}
function drawTitle(){
  const g = ctx.createLinearGradient(0, 0, 0, VH); g.addColorStop(0, '#06060e'); g.addColorStop(1, '#140c10');
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  glow(VW / 2, VH + 80, 520, 'rgba(255,170,70,A)', 0.32 + Math.sin(frame * 0.02) * 0.05);
  glow(VW / 2, 175, 260, 'rgba(255,214,140,A)', 0.08);
  for (let i = 0; i < 80; i++) {
    const x = (i * 157 + Math.sin(frame * 0.01 + i) * 30) % VW, y = VH - ((i * 89 + frame * (0.3 + (i % 4) * 0.2)) % VH);
    ctx.fillStyle = `rgba(255,${180 + (i % 3) * 25},100,${0.2 + (i % 5) * 0.09})`; circle(x, y, 0.8 + (i % 3));
  }
  ctx.restore();
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fbefd0'; ctx.shadowColor = 'rgba(255,190,90,.8)'; ctx.shadowBlur = 30;
  ctx.font = 'italic 80px Georgia'; ctx.fillText('Lanternfall', VW / 2, 190); ctx.shadowBlur = 0;
  ctx.font = '18px Georgia'; ctx.fillStyle = '#c8b994';
  ctx.fillText('The sun lies buried. You are the last of its knights.', VW / 2, 232);
  const opts = titleOptions();
  opts.forEach((o, i) => {
    const sel = i === menuSel, y = 300 + i * 40;
    ctx.font = (sel ? 'italic ' : '') + '26px Georgia'; ctx.fillStyle = sel ? '#ffd36a' : '#8a8070';
    ctx.fillText(o, VW / 2, y);
    if (sel) drawFlame(VW / 2 - ctx.measureText(o).width / 2 - 22, y - 2, 0.6, '#ffb347', '#fff0c0');
  });
  ctx.fillStyle = '#7d7466'; ctx.font = '15px Georgia';
  const touch = document.body.classList.contains('touch');
  ctx.fillText(touch ? '▲ ▼ choose · tap the screen to confirm' : '↑ ↓ choose · Enter / Z / tap to confirm', VW / 2, 300 + opts.length * 40 + 6);
  if (!touch) {
    ctx.fillText('Move: Arrows / WASD   Jump: Z / Space   Slash: X / J   Heal: hold F', VW / 2, 470);
    ctx.fillText('Hold ↑ or ↓ while slashing to aim. Strike down onto foes or thorns to bounce.', VW / 2, 494);
  }
}
function drawWin(){
  ctx.fillStyle = '#fff8e6'; ctx.fillRect(0, 0, VW, VH);
  glow(VW / 2, VH, 520, 'rgba(255,190,90,A)', 0.6);
  ctx.textAlign = 'center'; ctx.fillStyle = '#5a3a10';
  ctx.font = 'italic 56px Georgia'; ctx.fillText('Dawn returns', VW / 2, 190);
  ctx.font = '19px Georgia'; ctx.fillStyle = '#6a5030';
  wrap('The Umbral Knight breaks apart, and the stolen light pours back into the earth. Far below, the old sun stirs and rises. Its last knight goes with it.', 620)
    .forEach((l, i) => ctx.fillText(l, VW / 2, 240 + i * 26));
  const s = Math.floor(playFrames / 60);
  ctx.fillStyle = '#3a2a10'; ctx.font = '18px Georgia';
  ctx.fillText(`Time ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}   ·   Embers ${P.embers}   ·   Heart vessels ${P.maxHp}`, VW / 2, 350);
  ctx.fillStyle = '#8a6a40'; ctx.font = '16px Georgia'; ctx.fillText('Thank you for playing. Press Enter or tap to return to the title.', VW / 2, 410);
}
function draw(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  if (mode === 'title') { drawTitle(); return; }
  if (mode === 'win') { drawWin(); return; }
  const sx = shake ? (Math.random() - 0.5) * shake : 0, sy = shake ? (Math.random() - 0.5) * shake : 0;
  ctx.setTransform(DPR, 0, 0, DPR, sx * DPR, sy * DPR);
  const par = P.x + P.w / 2 - VW / 2;
  ctx.drawImage(farCanvas, -PAD - par * 0.04, 0, VW + PAD * 2, VH);
  ctx.drawImage(midCanvas, -PAD - par * 0.1, 0, VW + PAD * 2, VH);
  drawFog(0.18, 0.7, VH * 0.35);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 36; i++) {
    const x = (i * 211 + frame * 0.15 * (1 + i % 4)) % VW, y = (i * 97 + Math.sin(frame * 0.012 + i) * 30 + 600) % VH;
    ctx.fillStyle = `hsla(${room.def.hue + 30},70%,80%,${0.1 + (i % 4) * 0.05})`; ctx.fillRect(x, y, 1.6, 1.6);
  }
  ctx.restore();
  ctx.drawImage(tileCanvas, 0, 0, VW, VH);
  drawDynamicTiles();
  items.forEach(drawItem);
  drawHealFX();
  room.ents.forEach(drawEnt);
  drawPlayer(); drawSlash();
  ctx.drawImage(foreCanvas, -PAD - par * 0.22, 0, VW + PAD * 2, VH);
  drawLighting(gatherLights(), sx, sy);
  drawRays();
  drawLances(); drawParticles(); drawRings();
  drawFog(0.35, 0.45, VH - 170);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.drawImage(vigC, 0, 0, VW, VH);
  drawHUD();
  if (mode === 'dead') {
    ctx.fillStyle = `rgba(0,0,0,${1 - deadT / 120})`; ctx.fillRect(0, 0, VW, VH);
    if (deadT < 80) { ctx.fillStyle = '#c8b994'; ctx.font = 'italic 26px Georgia'; ctx.textAlign = 'center'; ctx.fillText('Your light gutters, but does not go out.', VW / 2, VH / 2); }
  }
  if (fadeIn > 0) { ctx.fillStyle = `rgba(0,0,0,${fadeIn})`; ctx.fillRect(0, 0, VW, VH); }
  if (flash > 0) { ctx.fillStyle = `rgba(255,248,225,${flash})`; ctx.fillRect(0, 0, VW, VH); }
  if (mode === 'pickup') drawPickup();
}

// test hook (harmless in play)
window.__lf = { P, get room(){ return room; }, loadRoom, get mode(){ return mode; }, flags: () => flags };

let acc = 0, last = performance.now();
function loop(now){
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { step(); acc -= 1000 / 60; }
  draw(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
